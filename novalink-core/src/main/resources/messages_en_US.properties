# ============================ console.help.<cmd> detailed usage ============================
console.help.help=help [command]\n  With no arg: list all commands.\n  With a command name: show detailed usage.\n
console.help.status=status\n  Prints: online players, connected servers, channels, active spy sessions, config reload count.\n
console.help.players=players\n  Lists all cached (online) players: playerId / name / clientId / activeChannel.\n
console.help.clients=clients\n  Lists authenticated game-server connections: clientId / remote address / port / connect time.\n
console.help.channels=channels\n  Lists every channel: id / scope / owner client / display name / member count.\n
console.help.channel=channel <id>\n  Shows one channel's detail + its member UUIDs.\n
console.help.mute=mute <player|name> <channel> <dur> [reason]\n  Mutes a player in a channel. Dur formats: 30s / 10m / 2h / 1d / 0 or 'perm' (permanent).\n  <player> may be a UUID or an online player name (cross-server resolved).\n  Example: mute Steve staff 10m spam\n
console.help.unmute=unmute <player> <channel>\n  Unmutes a player in a channel. <player> may be a UUID or an online name.\n
console.help.mutes=mutes [player]\n  With no arg: lists all active mutes across online players.\n  With a player UUID or name: lists that player's active mutes.\n
console.help.kick=kick <player> <channel>\n  Kicks a player from a channel (cross-server name resolution). <player> may be a UUID or name.\n
console.help.announce=announce <channel> <msg...>\n  Broadcasts an announcement prefixed with [Announcement] to the channel via the message router.\n
console.help.title=title <channel> <title> [subtitle...]\n  Sends a TitlePacket to the channel (broadcast for GLOBAL, single client for SERVER/PRIVATE).\n
console.help.reload=reload\n  Hot-reloads config and broadcasts a ConfigSyncPacket to all authenticated clients.\n
console.help.spies=spies\n  Lists all currently monitored channels + total spy session count.\n
console.help.spy=spy start <channel> [adminId]\n  spy off [adminId]\n  Starts/stops spy sessions. adminId defaults to the console sentinel.\n
console.help.create=create <name> [password] [scope]\n  Creates a channel. scope = global (default) or private. If a password is given, the channel is created private+password.\n
console.help.delete=delete <id>\n  Deletes a channel. Removes members and (for private) untracks the id.\n
console.help.stop=stop|shutdown\n  Triggers graceful shutdown of all backend services.\n


# Non-Java Bedrock client CI: Endstone (Python), LeviLamina (C++/xmake), PMMP (PHP).
#
# These three modules do not use the Gradle Java plugin (they are Gradle `base`
# wrappers that delegate to native toolchains). This workflow drives each native
# toolchain directly so CI validates them without going through Gradle.
#
# Job layout:
#   endstone     - ubuntu-24.04, Python 3.12, pip install -e .[dev], pytest
#   levilamina   - windows-2022 (VS 2022 / MSVC 14.43), xmake, full SDK-integrated
#                  build + test (pulls levilamina from LiteLDev/xmake-repo, builds
#                  the .dll + tests binary, runs the tests). Pinned to
#                  windows-2022 because windows-2025 ships only VS 2026
#                  (MSVC 14.44), which levilamina 26.20.7 does not compile under.
#                  Aligns with the official LeviLamina mod template: xmake is
#                  set up via xmake-io/github-action-setup-xmake@v1 (which also
#                  caches xmake packages + build dir), `xmake repo -u` refreshes
#                  the package index, and the build uses the template's command
#                  form (xmake f -a x64 -p windows -m release --target_type=server -y
#                  then xmake build <target>). xmake.lua has set_runtimes("MD")
#                  + levibuildscript link/modpack rules so the whole toolchain
#                  is MD-consistent (no LNK2038 MDd-vs-MD mismatch). levilamina
#                  is a SOURCE xmake package (no prebuilt binary), so compiling
#                  it from source with MSVC is unavoidable -- the package +
#                  build caches make it a one-time cost per xmake.lua change.
#   pmmp         - ubuntu-24.04, PHP 8.2, composer install + phpunit. pocketmine-mp
#                  5.x requires PocketMine-private PHP extensions (ext-chunkutils2,
#                  ext-leveldb, ...) that standard PHP cannot install, so
#                  `composer install` uses --ignore-platform-reqs; the unit tests
#                  only exercise NovaChat\Protocol\* via a custom bootstrap and
#                  never touch those runtime exts. A `php -m` gate still asserts
#                  the three exts NovaChat itself needs (sockets/mbstring/openssl)
#                  are genuinely loaded.
name: Bedrock Non-Java Build & Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bedrock-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endstone:
    name: Endstone (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NovaChat/Bedrock/endstone

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-endstone-${{ runner.os }}-${{ hashFiles('NovaChat/Bedrock/endstone/pyproject.toml') }}
          restore-keys: |
            pip-endstone-${{ runner.os }}-

      - name: Install package (editable + dev extras)
        # pyproject.toml dev extras: pytest, pytest-asyncio, hypothesis.
        # The endstone>=0.5.0 runtime dep is a pure-Python wheel; the unit tests
        # only import novachat_endstone.protocol/i18n (no endstone runtime needed).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v

  levilamina:
    name: LeviLamina (C++/xmake)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: NovaChat/Bedrock/levilamina

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSVC (VS 2022)
        uses: microsoft/setup-msbuild@v2
        # windows-2022 ships VS 2022 Enterprise (MSVC 14.43 / v143 toolset).
        # We pin to windows-2022 (NOT windows-2025) because windows-2025 now
        # ships ONLY Visual Studio 2026 (MSVC 14.44 / v144), and levilamina
        # 26.20.7 -- a C++20 BDS plugin framework that embeds compiler-specific
        # intrinsics and matches a specific BDS/MSVC toolchain -- fails to
        # compile its own sources under MSVC 14.44 (xmake hides the real
        # compiler error behind install.txt; the build step below dumps it).
        # VS 2022 is the toolchain levilamina targets, so windows-2022 is the
        # correct runner. This action puts cl.exe/link.exe on PATH for xmake's
        # msvc toolchain detection.

      - name: Set up xmake
        # Official xmake setup action (xmake-io/github-action-setup-xmake). This
        # replaces a hand-rolled NSIS installer we used earlier -- the hand-rolled
        # version existed only because I (wrongly) probed `xmake-io/setup-xmake`
        # (missing the `github-action-` infix) and concluded no official action
        # existed. The real coordinate is `xmake-io/github-action-setup-xmake@v1`,
        # maintained by an xmake core member (OpportunityLiu); the official
        # LeviLamina mod template's own CI uses exactly this action. It handles
        # xmake download + PATH + optional xmake/package/build caching in one
        # step.
        #
        # xmake-version is PINNED to 3.0.9 (NOT `latest`) because:
        # - 3.0.9 is the exact version the levilamina migration was validated
        #   against locally (dll builds+links, 83/83 tests pass) -- see the
        #   -v build-subcommand note below which is 3.0.9-specific behavior.
        # - 3.1.0 (the current `latest` as of 2026-08) breaks this action's own
        #   cache-key step: the action runs `xmake l utils.ci.packageskey`
        #   internally to compute the package-cache key, and under 3.1.0 that
        #   script exits -1 (4294967295) -- the script exists at
        #   modules/utils/ci/packageskey.lua in 3.0.9 and returns a hash, but
        #   3.1.0's version fails under this action's invocation. Pinning avoids
        #   the `latest` floating-version footgun. Bump deliberately when a newer
        #   xmake release is verified to keep utils.ci.packageskey + the build
        #   subcommand -v behavior working.
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'
          # Package cache = the levilamina SDK + deps (fmt/leveldb/entt/...).
          # Build cache = incremental object files. Both are keyed on xmake.lua
          # below via the action's own cache keys; enabling them here lets the
          # action manage cache restore/save so we can drop our separate
          # actions/cache@v4 steps.
          package-cache: true
          package-cache-key: xmake-pkg-win2022-md-${{ hashFiles('NovaChat/Bedrock/levilamina/xmake.lua') }}
          build-cache: true
          build-cache-key: xmake-build-win2022-md-${{ hashFiles('NovaChat/Bedrock/levilamina/xmake.lua', 'NovaChat/Bedrock/levilamina/src/**', 'NovaChat/Bedrock/levilamina/tests/**') }}

      - name: Show xmake version
        shell: pwsh
        run: xmake --version

      - name: Refresh xmake package index
        # `xmake repo -u` updates the levimc-repo (LiteLDev/xmake-repo) package
        # manifest so add_requires("levilamina") resolves the latest published
        # version. Without this, a stale local repo index can fail to find a
        # version that exists upstream. (Official LeviLamina template CI runs
        # this before `xmake f`.)
        shell: pwsh
        working-directory: NovaChat/Bedrock/levilamina
        run: xmake repo -u

      # ------------------------------------------------------------------
      # Full SDK-integrated build + test (with LeviLamina SDK).
      # xmake pulls levilamina (+ transitive deps: entt, fmt, leveldb, ...) from
      # levimc-repo (LiteLDev/xmake-repo) on github, links them into the
      # novachat-levilamina shared library AND the novachat-levilamina-tests
      # binary, then runs the tests. This is the real, complete test -- no
      # --sdk=n shortcut. Command form mirrors the official LeviLamina mod
      # template CI (LiteLDev/levilamina-mod-template/.github/workflows/build.yml):
      #   xmake f -a x64 -m release -p windows -v --target_type=server -y
      #   xmake -v -y
      #
      # We pass -a x64 -p windows explicitly (template does too) so xmake does
      # not depend on host auto-detection.
      #
      # NOTE: we do NOT pass --target_type=server on the command line, even
      # though the official template does. The template defines a project-level
      # option("target_type") in its xmake.lua so --target_type is a valid CLI
      # option there; our xmake.lua does NOT define that option (we are not the
      # mod template supporting server/client switching), so passing it here
      # would fail with `error: Invalid option: --target_type=server`. Our
      # xmake.lua instead hard-codes target_type="server" in the
      # add_requires("levilamina", {configs = {target_type = "server"}}) call,
      # which is the correct way to set it without a project option.
      #
      # MODE = release: the xmake.lua now has `set_runtimes("MD")`, which forces
      # the WHOLE toolchain (levilamina + deps + our targets) to the MD runtime
      # regardless of mode -- so debug would ALSO link cleanly now. We keep
      # -m release to match the official template and because CI does not need
      # debug symbols. (Before set_runtimes was added, -m debug flipped deps to
      # MDd while levilamina stayed MD -> LNK2038; that root cause is now fixed
      # in xmake.lua, not papered over by the mode choice here.)
      #
      # -y (only on `xmake f`): auto-confirms package installs (xmake prompts
      #   "please input: y (y/n/m)" in configure; non-TTY CI would hang without
      #   it). `-y` is a CONFIGURE/require option, NOT a build-subcommand option
      #   -- `xmake build -y <target>` rejects it as "'-y' is not a valid target
      #   name". Packages are installed after `xmake f -y`, so build never
      #   prompts and must NOT pass -y. (The template's `xmake -v -y` works only
      #   because it does NOT name a target -- bare `xmake` builds the default
      #   goal, so -y is not parsed as a target name. We name targets explicitly
      #   to control build order, so we omit -y on build.)
      # -v/--verbose: surfaces package-build compiler errors in the job log
      #   (xmake otherwise hides them in install.txt under .xmake/cache/...);
      #   the catch below also dumps every install.txt it can find as a fallback.
      #   -v is passed ONLY on `xmake f` (configure), NOT on `xmake build`. The
      #   build subcommand in xmake v3.0.9 rejects -v entirely -- both
      #   `xmake build <target> -v` (target then -v) and `xmake -v build <target>`
      #   (-v then target) fail with "error: invalid argument" (it prints the
      #   build-subcommand help and exits -1). The official LeviLamina template
      #   avoids this by using bare `xmake -v -y` (no build subcommand, no target
      #   name -- builds the default goal with -v as a global option). We name
      #   targets explicitly to control build order, so we simply omit -v on
      #   build: configure's -v already surfaces package compiler errors (the
      #   expensive part -- levilamina compiles its own sources from source),
      #   and our own target sources are small so build is non-verbose. The
      #   install.txt dump fallback below catches any build-stage compiler error
      #   that configure's -v missed.
      #
      # The .dll (novachat-levilamina) is built to prove the SDK integration
      # links cleanly; the tests binary is then built and RUN -- a successful
      # compile + link + test run is the gate. No continue-on-error: a real
      # failure must redden the job.
      # ------------------------------------------------------------------
      - name: Build & run SDK-integrated tests (levilamina pkg)
        shell: pwsh
        working-directory: NovaChat/Bedrock/levilamina
        run: |
          $ErrorActionPreference = 'Continue'
          function Invoke-Xmake([string[]]$XmakeArgs) {
            Write-Host "==> xmake $($XmakeArgs -join ' ')"
            & xmake @XmakeArgs
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              Write-Host "::error::xmake $($XmakeArgs -join ' ') failed with exit $code"
              Write-Host '----- dumping all xmake install.txt logs (compiler errors) -----'
              $cacheRoot = Join-Path $env:LOCALAPPDATA '.xmake\cache'
              if (Test-Path $cacheRoot) {
                Get-ChildItem -Path $cacheRoot -Recurse -Filter 'install.txt' -ErrorAction SilentlyContinue |
                  ForEach-Object {
                    Write-Host "----- $($_.FullName) -----"
                    Get-Content $_.FullName -Tail 80
                  }
              } else {
                Write-Host "(no .xmake cache root at $cacheRoot)"
              }
              exit $code
            }
          }
          Invoke-Xmake 'f', '-a', 'x64', '-p', 'windows', '-m', 'release', '-y', '-v'
          Invoke-Xmake 'build', 'novachat-levilamina'
          Invoke-Xmake 'build', 'novachat-levilamina-tests'
          Invoke-Xmake 'run', 'novachat-levilamina-tests'

  pmmp:
    name: PMMP (PHP)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NovaChat/Bedrock/pmmp

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sockets, mbstring, openssl
          coverage: none

      - name: Cache composer vendor
        uses: actions/cache@v4
        with:
          path: NovaChat/Bedrock/pmmp/vendor
          # composer.lock is gitignored, so key on composer.json's hash instead.
          # A dependency change in composer.json invalidates the cache; otherwise
          # the vendor dir is reused and `composer install` only tops it up.
          key: composer-${{ runner.os }}-${{ hashFiles('NovaChat/Bedrock/pmmp/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Verify required PHP extensions (platform-reqs gate)
        # composer.json has "platform-check": false, and composer.lock is
        # gitignored (pocketmine-plugin convention -- the pocketmine-mp host
        # version must not be pinned by a committed lock). So we CANNOT use
        # `composer check-platform-reqs`: with no lock it dies with
        # "[LogicException] No lockfile found", and with --lock it would read
        # the absent lock too. Instead, assert each ext-* from composer.json's
        # `require` is actually loaded via `php -m`. This is the real guarantee
        # we wanted (extensions truly present, not silently absent at runtime)
        # without depending on a lockfile that is deliberately not committed.
        run: |
          set -e
          for ext in sockets mbstring openssl; do
            if ! php -m | grep -i "^$ext$" > /dev/null; then
              echo "ERROR: required PHP extension '$ext' is NOT loaded"
              php -m
              exit 1
            fi
            echo "OK: ext-$ext loaded"
          done

      - name: Composer install
        # Pulls pocketmine/pocketmine-mp ^5.0 (~100MB) + phpunit + eris.
        # composer.lock is deliberately gitignored (pocketmine-plugin
        # convention -- do not pin the host pocketmine-mp version), so this
        # resolves the ^5.0 constraint fresh each run rather than reading a
        # committed lock. The constraint is narrow enough that this is stable.
        #
        # --ignore-platform-reqs: pocketmine-mp 5.x requires PocketMine-private
        # PHP extensions (ext-chunkutils2, ext-crypto, ext-leveldb, ext-pmmpthread,
        # ...) that ship ONLY in the PocketMine binary distribution -- standard
        # PHP (shivammathur/setup-php) cannot install them, so a plain
        # `composer install` dies on ext-chunkutils2. That is fine for CI: the
        # unit tests only exercise NovaChat\Protocol\* (VarInt, packet
        # serialization) via a custom PSR-4 bootstrap (tests/bootstrap.php) and
        # never instantiate pocketmine runtime classes, so the missing exts
        # are never touched at test time. Ignoring platform reqs lets the
        # type-stub pocketmine-mp source download so phpunit's autoloader can
        # resolve `pocketmine\*` symbols referenced in NovaChat source, without
        # requiring the runtime extensions. The `php -m` gate above still
        # asserts the three exts NovaChat itself needs (sockets/mbstring/
        # openssl) are genuinely loaded.
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-reqs

      - name: Run PHPUnit
        run: composer test

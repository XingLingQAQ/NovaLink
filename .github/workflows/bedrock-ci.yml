# Non-Java Bedrock client CI: Endstone (Python), LeviLamina (C++/xmake), PMMP (PHP).
#
# These three modules do not use the Gradle Java plugin (they are Gradle `base`
# wrappers that delegate to native toolchains). This workflow drives each native
# toolchain directly so CI validates them without going through Gradle.
#
# Job layout:
#   endstone     - ubuntu-24.04, Python 3.12, pip install -e .[dev], pytest
#   levilamina   - windows-2025, MSVC + xmake, full SDK-integrated build + test
#                  (pulls levilamina from liteldev-repo, builds the .dll + tests
#                  binary, runs the tests; -y auto-confirms package installs)
#   pmmp         - ubuntu-24.04, PHP 8.2, composer install + phpunit. pocketmine-mp
#                  5.x requires PocketMine-private PHP extensions (ext-chunkutils2,
#                  ext-leveldb, ...) that standard PHP cannot install, so
#                  `composer install` uses --ignore-platform-reqs; the unit tests
#                  only exercise NovaChat\Protocol\* via a custom bootstrap and
#                  never touch those runtime exts. A `php -m` gate still asserts
#                  the three exts NovaChat itself needs (sockets/mbstring/openssl)
#                  are genuinely loaded.
name: Bedrock Non-Java Build & Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bedrock-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endstone:
    name: Endstone (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NovaChat/Bedrock/endstone

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-endstone-${{ runner.os }}-${{ hashFiles('NovaChat/Bedrock/endstone/pyproject.toml') }}
          restore-keys: |
            pip-endstone-${{ runner.os }}-

      - name: Install package (editable + dev extras)
        # pyproject.toml dev extras: pytest, pytest-asyncio, hypothesis.
        # The endstone>=0.5.0 runtime dep is a pure-Python wheel; the unit tests
        # only import novachat_endstone.protocol/i18n (no endstone runtime needed).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v

  levilamina:
    name: LeviLamina (C++/xmake)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: NovaChat/Bedrock/levilamina

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSVC (VS 2022)
        uses: microsoft/setup-msbuild@v2
        # windows-2025 ships VS 2022 + MSVC 19.3x (C++20 capable). This action
        # puts cl.exe/link.exe on PATH for xmake's msvc toolchain detection.

      - name: Install xmake
        # windows-2025 runners do NOT ship scoop, and there is no official
        # xmake setup action (xmake-io/setup-xmake does not exist -- the
        # correct org is xmake-io/xmake, which publishes release assets, not
        # an action). So we install xmake directly from its GitHub release:
        #   1. Query the latest release API for the win64 NSIS installer URL.
        #   2. Download xmake-v<ver>.win64.exe (~4MB).
        #   3. Run it with NSIS silent flags (/S + /D=<dir>) -- no UAC, no UI.
        #   4. Prepend the install dir to PATH so later steps find xmake.
        # Pinned to v3.1.0 via the asset-name glob below; bump when a new
        # xmake major is released. Idempotent: if xmake is already on PATH
        # (e.g. from a restored cache) the install is skipped.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command xmake -ErrorAction SilentlyContinue) {
            Write-Host "xmake already on PATH, skipping install"
            xmake --version
            return
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'xmake'
          $api = 'https://api.github.com/repos/xmake-io/xmake/releases/latest'
          $rel = Invoke-RestMethod -Uri $api -Headers @{ 'User-Agent' = 'novalink-ci' }
          Write-Host "Latest xmake release: $($rel.tag_name)"
          $asset = $rel.assets | Where-Object { $_.name -eq 'xmake-v3.1.0.win64.exe' } |
                   Select-Object -First 1
          if (-not $asset) {
            throw "xmake-v3.1.0.win64.exe not found in release $($rel.tag_name); available: $($rel.assets.name -join ', ')"
          }
          $installer = Join-Path $env:RUNNER_TEMP 'xmake-setup.exe'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer -UseBasicParsing
          Write-Host "Installing xmake silently to $installDir"
          & $installer /S "/D=$installDir"
          # NSIS /D install returns before files are fully flushed; wait briefly.
          Start-Sleep -Seconds 2
          if (-not (Test-Path (Join-Path $installDir 'xmake.exe'))) {
            throw "xmake.exe not found at $installDir after silent install"
          }
          # Prepend to PATH for this step AND persist for subsequent steps via
          # $GITHUB_PATH (one path per line, UTF-8 *without* BOM -- PowerShell
          # 5.1's Out-File -Encoding utf8 emits a BOM that corrupts the first
          # path, so use the .NET API which is BOM-free by default here).
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$installDir`n")
          $env:PATH = "$installDir;$env:PATH"
          xmake --version

      - name: Show xmake version
        shell: pwsh
        run: xmake --version

      - name: Cache xmake packages (LeviLamina SDK)
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          # xmake.lua pulls levilamina from liteldev-repo; key on the xmake.lua
          # hash so a version bump invalidates the cache and re-fetches.
          key: xmake-pkg-${{ runner.os }}-${{ hashFiles('NovaChat/Bedrock/levilamina/xmake.lua') }}
          restore-keys: |
            xmake-pkg-${{ runner.os }}-

      - name: Cache xmake build directory
        uses: actions/cache@v4
        with:
          path: NovaChat/Bedrock/levilamina/build
          key: xmake-build-${{ runner.os }}-${{ hashFiles('NovaChat/Bedrock/levilamina/xmake.lua', 'NovaChat/Bedrock/levilamina/src/**', 'NovaChat/Bedrock/levilamina/tests/**') }}
          restore-keys: |
            xmake-build-${{ runner.os }}-

      # ------------------------------------------------------------------
      # Full SDK-integrated build + test (with LeviLamina SDK).
      # xmake pulls levilamina (+ transitive deps: entt, fmt, leveldb, ...) from
      # liteldev-repo on github, links them into the novachat-levilamina shared
      # library AND the novachat-levilamina-tests binary, then runs the tests.
      # This is the real, complete test -- no --sdk=n shortcut.
      #
      # -y: xmake prompts "please input: y (y/n/m)" to confirm package installs;
      #   in a non-TTY CI shell this hangs and fails ("must be installed!").
      #   -y auto-confirms so package install proceeds non-interactively.
      #
      # The .dll (novachat-levilamina) is built to prove the SDK integration
      # links cleanly; the tests binary is then built and RUN -- a successful
      # compile + link + test run is the gate. No continue-on-error: a real
      # failure must redden the job.
      # ------------------------------------------------------------------
      - name: Build & run SDK-integrated tests (levilamina pkg)
        shell: pwsh
        working-directory: NovaChat/Bedrock/levilamina
        run: |
          xmake f -m debug -y
          xmake build novachat-levilamina -y
          xmake build novachat-levilamina-tests -y
          xmake run novachat-levilamina-tests

  pmmp:
    name: PMMP (PHP)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NovaChat/Bedrock/pmmp

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sockets, mbstring, openssl
          coverage: none

      - name: Cache composer vendor
        uses: actions/cache@v4
        with:
          path: NovaChat/Bedrock/pmmp/vendor
          # composer.lock is gitignored, so key on composer.json's hash instead.
          # A dependency change in composer.json invalidates the cache; otherwise
          # the vendor dir is reused and `composer install` only tops it up.
          key: composer-${{ runner.os }}-${{ hashFiles('NovaChat/Bedrock/pmmp/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Verify required PHP extensions (platform-reqs gate)
        # composer.json has "platform-check": false, and composer.lock is
        # gitignored (pocketmine-plugin convention -- the pocketmine-mp host
        # version must not be pinned by a committed lock). So we CANNOT use
        # `composer check-platform-reqs`: with no lock it dies with
        # "[LogicException] No lockfile found", and with --lock it would read
        # the absent lock too. Instead, assert each ext-* from composer.json's
        # `require` is actually loaded via `php -m`. This is the real guarantee
        # we wanted (extensions truly present, not silently absent at runtime)
        # without depending on a lockfile that is deliberately not committed.
        run: |
          set -e
          for ext in sockets mbstring openssl; do
            if ! php -m | grep -i "^$ext$" > /dev/null; then
              echo "ERROR: required PHP extension '$ext' is NOT loaded"
              php -m
              exit 1
            fi
            echo "OK: ext-$ext loaded"
          done

      - name: Composer install
        # Pulls pocketmine/pocketmine-mp ^5.0 (~100MB) + phpunit + eris.
        # composer.lock is deliberately gitignored (pocketmine-plugin
        # convention -- do not pin the host pocketmine-mp version), so this
        # resolves the ^5.0 constraint fresh each run rather than reading a
        # committed lock. The constraint is narrow enough that this is stable.
        #
        # --ignore-platform-reqs: pocketmine-mp 5.x requires PocketMine-private
        # PHP extensions (ext-chunkutils2, ext-crypto, ext-leveldb, ext-pmmpthread,
        # ...) that ship ONLY in the PocketMine binary distribution -- standard
        # PHP (shivammathur/setup-php) cannot install them, so a plain
        # `composer install` dies on ext-chunkutils2. That is fine for CI: the
        # unit tests only exercise NovaChat\Protocol\* (VarInt, packet
        # serialization) via a custom PSR-4 bootstrap (tests/bootstrap.php) and
        # never instantiate pocketmine runtime classes, so the missing exts
        # are never touched at test time. Ignoring platform reqs lets the
        # type-stub pocketmine-mp source download so phpunit's autoloader can
        # resolve `pocketmine\*` symbols referenced in NovaChat source, without
        # requiring the runtime extensions. The `php -m` gate above still
        # asserts the three exts NovaChat itself needs (sockets/mbstring/
        # openssl) are genuinely loaded.
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-reqs

      - name: Run PHPUnit
        run: composer test

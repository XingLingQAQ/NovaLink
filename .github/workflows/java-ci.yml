# Java build + test CI for the NovaLink monorepo.
#
# Covers all Gradle Java modules (NovaChat:common, client-core, StarLink:core,
# the 7 server-side platforms, and the MOD loader subprojects fabric/neoforge/quilt
# which use fabric-loom / NeoGradle). Runs `./gradlew build test` with the Gradle 9
# wrapper, JDK 21 (primary) + JDK 25 (velocity toolchain).
#
# Design notes:
# - gradle.properties ships a Windows scoop path in org.gradle.java.installations.paths
#   that does not exist on ubuntu. We override it to empty via -P so Gradle's
#   toolchain auto-detection finds the setup-java installations instead.
# - shadow is com.gradleup.shadow 9.6.1 (Gradle-9 compatible), NOT 8.1.1, so the
#   pnx/folia/sponge fat jars build normally under the 9.6.1 wrapper.
# - neoforge NeoGradle builds an MC workspace (~20min first run); we cache
#   NeoForm/loom outputs keyed on the MC + neoforge version pins.
name: Java Build & Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (primary) and JDK 25 (velocity toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          # setup-java registers both as Gradle toolchain candidates.

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'settings.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache MOD loom / NeoForm workspaces
        uses: actions/cache@v4
        with:
          path: |
            NovaChat/MOD/neoforge/build/neoForm
            NovaChat/MOD/fabric/build/loom-cache
            NovaChat/MOD/quilt/build/loom-cache
            NovaChat/MOD/fabric/.gradle/remappedMods
            NovaChat/MOD/quilt/.gradle/remappedMods
          # MC 1.21.11 + neoforge 21.11.44 + fabric-loom 1.17.17 are pinned in
          # the mod build.gradle files; bump the key when those pins change.
          key: mod-loom-${{ runner.os }}-mc1.21.11-neoforge21.11.44-loom1.17.17-${{ hashFiles('NovaChat/MOD/**/build.gradle', 'NovaChat/MOD/**/gradle.properties') }}
          restore-keys: |
            mod-loom-${{ runner.os }}-

      - name: Build and test all Java modules
        env:
          # Ensure a UTF-8 locale for Java source encoding (ubuntu runners default to C.UTF-8,
          # this is belt-and-braces for processResources expand() of zh_CN resources).
          JAVA_TOOL_OPTIONS_OPTIONS: "-Dfile.encoding=UTF-8"
        run: |
          # Override the Windows scoop installations path so Gradle's toolchain
          # auto-detection falls back to the setup-java installs (JDK 21 + 25).
          ./gradlew build test --console=plain \
            -Porg.gradle.java.installations.paths= \
            -Dorg.gradle.java.installations.paths=

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-build-reports-${{ github.run_id }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

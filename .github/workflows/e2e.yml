# NovaLink real-server E2E CI -- OPT-IN.
#
# This workflow is OPT-IN: it only runs on manual dispatch (workflow_dispatch)
# or nightly schedule. It NEVER runs on push/PR, because E2E depends on external
# server downloads (Purpur, PaperMC, Cloudburst maven, pmmp, minecraft.net BDS)
# whose availability is flaky and would intermittently redden PRs. The main
# build+test CI lives in nova-ci.yml.
#
# What it does:
#   1. Restores the committed test/ harness (scripts + versions.lock.ps1).
#   2. Restores the server-binary cache keyed on versions.lock.ps1 (so a lock
#      bump invalidates and forces a fresh verified download).
#   3. Sets up EVERY toolchain the E2E matrix can reach: JDK 21 (most
#      platforms) + JDK 25 (folia + velocity, both runtime and plugin build) +
#      Node (mineflayer + bedrock-protocol bots) + Python (endstone) + MSVC +
#      xmake (levilamina dll build). Neither a system PHP nor JDK 17 is set up:
#      PocketMine needs pmmp's own PHP build (see the pmmp note below), which
#      the harness provisions, and sponge runs on 21 now.
#   4. Runs `./gradlew realE2E -PenableRealE2E=true` which dispatches to
#      test/bin/run-e2e-orchestrator.ps1 for the requested platform subset.
#   5. On failure, uploads e2e artifacts (logs, results.json, bot-results.json)
#      for post-mortem.
#
# Coverage notes:
#   - ALL 10 platforms are IMPLEMENTED in the committed harness:
#       bukkit, endstone, levilamina, pmmp via self-contained scripts
#       (run-bukkit/run-endstone/run-levilamina/run-pmmp-e2e.ps1);
#       folia, velocity, bungee, nukkit, pnx, sponge via the shared
#       multiplatform dispatch (run-multiplatform-e2e.ps1), each with a real
#       GradleTask + JarGlob + BuildJdk + PluginsSubdir.
#   - Server-binary downloads (Purpur, PaperMC, Cloudburst maven, Sponge
#     maven, pmmp, minecraft.net BDS) are flaky and may be blocked from some
#     runner environments. Platforms whose download fails exit non-zero
#     (FAIL/red): bukkit, folia, nukkit, pnx, sponge, pmmp. continue-on-error
#     below keeps download-flaky platforms from reddening the whole nightly.
#   - SKIPPED is NOT PASS. A platform that did not run its L1 flow signals
#     SKIPPED with exit code 3 (endstone/levilamina: BDS binary unavailable;
#     velocity/bungee: proxy-only by design). run-e2e-orchestrator.ps1 maps 3
#     to status=SKIPPED in e2e-orchestrator-summary.json and prints
#     "endstone     SKIPPED (BDS unavailable)". It never prints PASS for a
#     platform that executed zero assertions.
#   - This workflow opts into strict mode (-Pe2eRequireAllPlatforms=true):
#     a SKIPPED platform fails the job. A BDS download-block therefore reds
#     the endstone/levilamina jobs instead of silently reporting green, which
#     is the point -- a green check must mean tests ran. Supply a cached BDS
#     zip (the dist cache) or reachable minecraft.net to get a real result.
#   - continue-on-error below still tolerates failure for platforms whose
#     nightly signal is environment-dependent (downloads, proxy-only scope).
#     The job is still marked failed, so the SKIP is visible; it does not
#     block the overall workflow conclusion.
#
# Runner: windows-2022 (E2E scripts are PowerShell + Windows process-tree
# management; levilamina needs VS 2022 / MSVC v143 which windows-2022 ships).
# This mirrors nova-ci.yml's runner choice.
name: E2E (Real Server)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to run (leave empty to run the full matrix, one platform per job)'
        required: false
        default: ''
  schedule:
    # Nightly at 03:30 UTC -- only runs on the default branch.
    - cron: '30 3 * * *'

permissions:
  contents: read

# One E2E run at a time per ref (nightly + manual dispatch don't pile up).
# Per-platform matrix jobs still fan out within a single run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E ${{ matrix.platform }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The full declared platform set. ALL 10 platforms are IMPLEMENTED in the
        # committed harness (see coverage notes above). continue-on-error below
        # is applied to download-flaky + SKIP-by-design platforms so the nightly
        # is not intermittently reddened by external download availability.
        platform: [bukkit, folia, velocity, bungee, nukkit, pnx, sponge, endstone, levilamina, pmmp]
    # continue-on-error allowlist = platforms whose nightly signal is unreliable:
    #   - folia/nukkit/pnx/sponge: FAIL (red) when a pinned/Auto download is
    #     blocked, which would flaky-red the nightly.
    #   - velocity/bungee: proxy-only, SKIPPED by design before any bot round-trip
    #     (a real regression cannot red them regardless of the gate).
    #   - endstone/levilamina: strict mode makes a BDS download-block a FAILURE
    #     (exit 3 SKIPPED -> orchestrator exit 1), which is intentional: they are
    #     NOT on this allowlist, so the job is marked failed and the skip is
    #     visible in the checks UI and the summary line, never as a green PASS.
    #     The hard-gate platforms are bukkit/endstone/levilamina/pmmp.
    # Note: continue-on-error does not hide a pass/fail mislabel; the step log and
    # the Gradle "[realE2E] --- Platform Outcomes ---" block report SKIPPED itself.
    continue-on-error: ${{ !contains(fromJson('["bukkit","endstone","levilamina","pmmp"]'), matrix.platform) }}

    env:
      # UTF-8 hardening (mirrors nova-ci.yml -- the E2E scripts emit Chinese +
      # non-ASCII server log lines).
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
      PYTHONUTF8: '1'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify committed E2E harness paths
        shell: pwsh
        run: ./test/bin/verify-orchestration-paths.ps1

      # ---------------------------------------------------------------------
      # JDK: 17 + 21 (primary, most platforms) + 25 (folia + velocity, runtime
      # and plugin build). setup-java registers all three as Gradle toolchain
      # candidates. Sponge moved 17 -> 21 (its universal jar's bootstrap is
      # class-file 65.0), and folia/velocity moved to 25 at RUNTIME as well
      # (26.1+ refuses < 25; Velocity 4.x classes are class-file 69.0). JDK 17
      # stays installed so the harness keeps a complete toolchain set.
      # ---------------------------------------------------------------------
      - name: Set up JDK 17 + 21 (primary) + 25 (folia/velocity)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      # ---------------------------------------------------------------------
      # Node 18+ for the bots: Java platforms use mineflayer (run-e2e.js),
      # Bedrock platforms use bedrock-protocol (run-e2e-bedrock.js). Both are
      # npm-installed from test/bot/package-lock.json.
      # ---------------------------------------------------------------------
      # mineflayer 4.39.0 and minecraft-protocol 1.68.0 declare node >= 22
      # (npm warns EBADENGINE on 18). The install itself succeeds on 18, so the
      # mismatch only shows up at runtime: the bot exits in a few hundred ms and
      # writes no results.json, which the harness reports as an L1 failure.
      # bedrock-protocol is pinned to 3.59.0, not 3.60.x: 3.60.0+ declares
      # node >= 24 AND pulls prismarine-xbox-services from a git ref that is
      # not published to npm, which npm's git allow-list blocks by default
      # (npm 11 still needs --allow-git=all). 3.59.0 supports Bedrock 1.26.45
      # and installs from the registry alone.
      - name: Set up Node 22 (mineflayer + bedrock-protocol bots)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: test/bot/package-lock.json

      - name: Install bot npm deps
        # The path contract above requires both package files. npm ci additionally
        # proves the committed lock is reproducible and fails on lock drift.
        shell: pwsh
        run: npm --prefix test/bot ci --no-audit --no-fund

      # ---------------------------------------------------------------------
      # PHP (pmmp) -- NO setup-php step, intentionally.
      #
      # PocketMine-MP 5.x refuses to boot unless TEN extensions are present,
      # and five of them (chunkutils2, crypto, encoding, morton, pmmpthread)
      # are PocketMine-private C extensions that exist in no standard PHP
      # distribution and in no PECL package. shivammathur/setup-php can only
      # install what PECL/php-src ships, so it could never satisfy the server:
      #   [ERROR] Selected PHP binary does not satisfy some requirements.
      # Installing the five PECL-able ones (gmp/igbinary/yaml/zip) would not
      # change that -- the other five are unobtainable.
      #
      # pmmp publishes prebuilt PHP builds bundling all ten at
      # github.com/pmmp/PHP-Binaries (asset PHP-<ver>-Windows-x64-PM5.zip).
      # The harness downloads that zip itself: run-pmmp-e2e.ps1 step 0 fetches
      # it via fetch-server.ps1 from the `pmmp-php` pin in
      # test/versions.lock.ps1 (immutable tag + SHA-256), extracts it to
      # .e2e-artifacts/dist/php-runtime/, and verifies the module list before
      # starting the server. Doing it in the harness rather than here keeps the
      # runtime usable from a local run and from CI with one code path.
      #
      # The dist cache step below covers this zip too (same dist dir + same
      # versions.lock.ps1 hash), so it is downloaded once per lock revision.
      #
      # If that download is blocked, run-pmmp-e2e.ps1 exits 3 (SKIPPED) with a
      # reason instead of failing with PocketMine's opaque extension list.
      # Strict mode (-Pe2eRequireAllPlatforms=true) still fails the job, so a
      # missing runtime is never reported as green.
      # ---------------------------------------------------------------------
      - name: Note PHP provisioning (pmmp)
        if: matrix.platform == 'pmmp'
        shell: pwsh
        run: |
          Write-Host "pmmp: PHP is provisioned by test/bin/run-pmmp-e2e.ps1 (pmmp/PHP-Binaries), not setup-php."
          Write-Host "pmmp: pin is the 'pmmp-php' entry in test/versions.lock.ps1; cached under .e2e-artifacts/dist."
          $sysPhp = Get-Command php -ErrorAction SilentlyContinue
          if ($sysPhp) {
            Write-Host "pmmp: note - a system PHP is on PATH at $($sysPhp.Source); it lacks the PocketMine extensions and will not be used."
          }

      # ---------------------------------------------------------------------
      # Python 3.12 (endstone). endstone's BDS host loads a python plugin;
      # setup-python keeps stdio UTF-8 via PYTHONUTF8 above. Same as nova-ci.
      # ---------------------------------------------------------------------
      - name: Set up Python 3.12 (endstone)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------------------------------------------------------------------
      # MSVC + xmake (levilamina). levilamina E2E builds a C++20 BDS dll with
      # MSVC v143 (windows-2022 = VS 2022) + xmake. xmake is pinned to 3.0.9
      # exactly as in nova-ci.yml (3.1.0 breaks the action's packageskey step).
      # ---------------------------------------------------------------------
      - name: Set up MSVC (VS 2022)
        uses: microsoft/setup-msbuild@v2

      - name: Set up xmake (levilamina)
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'
        continue-on-error: true

      - name: Verify xmake is on PATH
        shell: pwsh
        run: |
          if (-not (Get-Command xmake -ErrorAction SilentlyContinue)) {
            Write-Error "xmake is not on PATH after setup-xmake step"
            exit 1
          }
          xmake --version

      # ---------------------------------------------------------------------
      # Server-binary cache. fetch-server.ps1 downloads real server jars/zip/
      # phar to .e2e-artifacts/dist/ and SHA-256-verifies them. Keying on
      # test/versions.lock.ps1 means a lock bump invalidates and forces a fresh
      # verified download; an unchanged lock reuses the cached binaries
      # (minutes saved per platform). Path matches docs/REAL-SERVER-E2E.md §8.2.
      # ---------------------------------------------------------------------
      - name: Cache E2E server binaries (dist)
        uses: actions/cache@v4
        with:
          path: .e2e-artifacts/dist
          key: e2e-dist-${{ runner.os }}-${{ hashFiles('test/versions.lock.ps1') }}
          restore-keys: |
            e2e-dist-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-e2e-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-e2e-${{ runner.os }}-

      # ---------------------------------------------------------------------
      # THE E2E RUN. `./gradlew realE2E` (root build.gradle) dispatches to the
      # committed test/bin/run-e2e-orchestrator.ps1 with -Platforms set to this
      # matrix platform (or the workflow_dispatch input on manual runs).
      # -PenableRealE2E=true is what gates realE2E into `check`; passing it
      # explicitly here also documents intent. The installations.paths=
      # override clears the dev scoop path from gradle.properties so Gradle
      # toolchain auto-detection finds the setup-java JDKs.
      #
      # The Gradle preflight fails if any required script, lock, bot package, or
      # config template is absent. Platform failures also fail this step.
      # ---------------------------------------------------------------------
      - name: Run E2E (${{ matrix.platform }})
        shell: pwsh
        env:
          # One platform per job. A manual dispatch may narrow the matrix with
          # the `platforms` input; jobs outside that selection are skipped by the
          # guard below instead of each re-running the same batch. The input
          # defaults to empty (full matrix) -- a non-empty default would make
          # every job run that same list, which is what happened before.
          E2E_PLATFORMS: ${{ matrix.platform }}
          E2E_SELECTED: ${{ github.event.inputs.platforms }}
          E2E_PLATFORM: ${{ matrix.platform }}
        run: |
          chcp 65001
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $selected = ($env:E2E_SELECTED -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($selected.Count -gt 0 -and ($selected -notcontains $env:E2E_PLATFORM)) {
            Write-Host "skipping $env:E2E_PLATFORM (not in the requested set: $($selected -join ', '))"
            exit 0
          }
          ./gradlew realE2E --console=plain `
            '-PenableRealE2E=true' `
            '-Pe2eRequireAllPlatforms=true' `
            "-Pe2ePlatforms=$env:E2E_PLATFORMS" `
            '-Porg.gradle.java.installations.paths=' `
            '-Dorg.gradle.java.installations.paths='

      # ---------------------------------------------------------------------
      # Dump what the E2E run actually left on disk before uploading. The
      # upload step used to report "No files were found" while this directory
      # was full of logs, with nothing in the job log to show what was there.
      # `-Force` is required because .e2e-artifacts is a hidden directory.
      # dist/ is excluded on purpose: it is the multi-hundred-MB server-binary
      # cache, not diagnostic output.
      # ---------------------------------------------------------------------
      - name: List E2E artifacts (diagnostics)
        if: failure() || cancelled()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath .e2e-artifacts)) {
            Write-Host '.e2e-artifacts does not exist'
            exit 0
          }
          $files = Get-ChildItem -LiteralPath .e2e-artifacts -Recurse -File -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/]dist[\\/]' }
          if (-not $files) {
            Write-Host '.e2e-artifacts exists but contains no files (excluding dist/)'
            exit 0
          }
          Write-Host ("{0} file(s) under .e2e-artifacts (excluding dist/):" -f @($files).Count)
          $files | Sort-Object FullName | Select-Object -First 200 | ForEach-Object {
            Write-Host ("{0,12:N0}  {1}" -f $_.Length, $_.FullName)
          }

      # ---------------------------------------------------------------------
      # Build a clean, small directory to upload.
      #
      # WHY THIS STEP EXISTS (run 39572033485, job "E2E folia"):
      #   The upload step died with
      #     Error: EBUSY: resource busy or locked, read
      #   while zipping `.e2e-artifacts/runs/`. Two things were true at once:
      #
      #   (a) ENABLING CAUSE -- server JVMs were still alive. Folia hit the
      #       Gradle 30-minute task timeout, which killed the orchestrator's
      #       process TREE. The orchestrator's own teardown never ran (its log
      #       has zero "teardown"/"TRAP" lines, unlike sponge's), so the JVM
      #       kept its handles on the server's stdout/stderr logs and on the
      #       memory-mapped world region files. The runner only killed those
      #       orphans at 09:20:23 -- two seconds AFTER the upload failed at
      #       09:20:21. Collection therefore cannot live in the orchestrator:
      #       in exactly the failure mode we care about, the orchestrator is
      #       already dead. It has to run as a workflow step, after the run.
      #
      #   (b) AGGRAVATING CAUSE -- the archiver read files that were still
      #       being appended to. A live server writing its log while yazl
      #       streams it is a read/write race on Windows.
      #
      #   Plus size: the folia run dir held 196 files / ~160 MB streamed, and
      #   108 of those files were *.jar (cache/mojang_26.1.2.jar alone is
      #   60 MB, plus the whole libraries/ tree). None of it is diagnostic
      #   value, and all of it is what made the zip slow enough to lose the
      #   race. pnx timed out too, but its run dir was 17 files of pure logs,
      #   so its upload succeeded -- same bug, smaller blast radius.
      #
      # So: kill the stragglers first (removes both (a) and the race in (b)),
      # then copy ONLY the diagnostic whitelist into a separate directory with
      # FileShare.ReadWrite (survives a writer that is still appending), then
      # upload only that directory. Locked files are retried and, if they stay
      # locked, skipped -- never fatal: this step runs on an already-failing
      # job and must not replace the real error with its own.
      # ---------------------------------------------------------------------
      - name: Collect E2E logs (kill stragglers, copy whitelist)
        if: failure() || cancelled()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $ws = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $ws = (Resolve-Path -LiteralPath $ws).Path.TrimEnd('\', '/')
          $wsLower = $ws.ToLowerInvariant()
          $srcRoot = Join-Path $ws '.e2e-artifacts'
          $dstRoot = Join-Path $srcRoot 'logs-only'

          Write-Host "=== [collect] workspace: $ws ==="
          if (-not (Test-Path -LiteralPath $srcRoot)) {
            Write-Host '[collect] .e2e-artifacts does not exist; nothing to collect'
            exit 0
          }

          # --- 1. kill residual server processes INSIDE the workspace ---------
          # The java/node executables live in the hosted tool cache and in
          # Program Files, NOT under the workspace, so filtering on
          # ExecutablePath alone would match nothing. Match a known server
          # executable name AND require either its executable path or its
          # command line to mention the workspace root -- every E2E server,
          # backend and bot is launched with a jar/script/classpath under it.
          # This is what keeps the step from killing the runner's own helpers
          # or any unrelated java/node on the host.
          #
          # The ancestors of THIS process are protected explicitly: a broad
          # name+path match must never take down the runner worker that is
          # about to upload the result.
          $protected = New-Object 'System.Collections.Generic.HashSet[int]'
          [void]$protected.Add($PID)
          $cursor = $PID
          for ($depth = 0; $depth -lt 12; $depth++) {
            $parent = Get-CimInstance Win32_Process -Filter "ProcessId=$cursor" -ErrorAction SilentlyContinue
            if (-not $parent) { break }
            $next = [int]$parent.ParentProcessId
            if ($next -le 0) { break }
            [void]$protected.Add($next)
            $cursor = $next
          }

          # Two match shapes are needed, because the two families of process are
          # launched differently:
          #
          #   java servers/backends -- start-server.ps1 / start-backend.ps1 pass
          #     an ABSOLUTE jar/classpath/config path, so CommandLine contains
          #     the workspace root. Path or command line both work here.
          #
          #   node bots -- run-multiplatform-e2e.ps1 launches `node run-e2e.js`
          #     with the workspace as the working directory only. Win32_Process
          #     exposes no WorkingDirectory, so neither ExecutablePath (node
          #     lives in the tool cache) nor CommandLine mentions the workspace.
          #     A path-only filter silently misses the bots, which are exactly
          #     the processes holding bot-results.json open. Match their script
          #     name instead, under the node executable name.
          $botScript = '(^|[\\/"''])(run-e2e(-bedrock)?\.js)($|[\\/"''])'

          $targets = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $nameOk = $_.Name -match '^(java|javaw|node|bedrock_server)(\.exe)?$'
            $nameOk -and
            -not $protected.Contains([int]$_.ProcessId) -and
            (
              ($_.ExecutablePath -and $_.ExecutablePath.ToLowerInvariant().StartsWith($wsLower)) -or
              ($_.CommandLine    -and $_.CommandLine.ToLowerInvariant().Contains($wsLower)) -or
              (
                $_.Name -match '^node(\.exe)?$' -and
                $_.CommandLine -and
                $_.CommandLine -match $botScript
              )
            )
          })

          Write-Host ("[collect] residual server process(es) inside the workspace: {0}" -f $targets.Count)
          foreach ($t in $targets) {
            Write-Host ("[collect]   stopping pid {0} ({1})" -f $t.ProcessId, $t.Name)
            try {
              Stop-Process -Id ([int]$t.ProcessId) -Force -ErrorAction Stop
            } catch {
              Write-Host ("[collect]   could not stop pid {0}: {1}" -f $t.ProcessId, $_.Exception.Message)
            }
          }

          # Wait for the killed processes to actually go away, so their file
          # handles are released before we copy. Bounded: a process stuck in a
          # native shutdown must not hang the job.
          if ($targets.Count -gt 0) {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $still = @($targets | Where-Object {
                Get-Process -Id ([int]$_.ProcessId) -ErrorAction SilentlyContinue
              })
            } while ($still.Count -gt 0 -and (Get-Date) -lt $deadline)
            Write-Host ("[collect] handle-release wait finished; still alive: {0}" -f $still.Count)
            # A short settle period for the OS to drop the last handle after
            # the process object is gone (memory-mapped regions linger briefly).
            Start-Sleep -Seconds 2
          }

          # --- 2. copy the diagnostic whitelist -------------------------------
          # Excluded on purpose:
          #   *.jar + libraries/  -- ~1.6 GB of dependency jars, zero value
          #   *.mca/*.mcr         -- world region binaries (memory-mapped while
          #                          the server runs; the classic EBUSY source)
          #   *.dat/*.nbt/*.zip   -- world/leveldb/archive binaries
          #   dist/               -- multi-hundred-MB server-binary cache
          #   *.exe/*.dll/*.so    -- server/plugin native payloads
          # Kept: *.log, *.txt (includes skip-reason.txt and eula.txt),
          # bot-results.json and the run summary JSON.
          $binaryExt = @('.jar', '.mca', '.mcr', '.dat', '.nbt', '.zip', '.phar',
                         '.exe', '.dll', '.so', '.dylib', '.class', '.pdb')
          $keepNames = @('bot-results.json', 'e2e-orchestrator-summary.json', 'e2e-summary.json')

          $candidates = @(Get-ChildItem -LiteralPath $srcRoot -Recurse -File -Force -ErrorAction SilentlyContinue |
            Where-Object {
              $full = $_.FullName
              ($full -notmatch '[\\/]dist[\\/]') -and
              ($full -notmatch '[\\/]logs-only[\\/]') -and
              ($full -notmatch '[\\/]libraries[\\/]') -and
              ($binaryExt -notcontains $_.Extension.ToLowerInvariant()) -and
              (
                ($_.Extension -ieq '.log') -or
                ($_.Extension -ieq '.txt') -or
                ($keepNames -contains $_.Name) -or
                ($_.Name -like '*summary*.json')
              )
            })

          Write-Host ("[collect] whitelisted candidate file(s): {0}" -f $candidates.Count)

          # Start from a clean slate so a retried/cancelled job cannot mix a
          # previous attempt's copies into this artifact.
          if (Test-Path -LiteralPath $dstRoot) {
            Remove-Item -LiteralPath $dstRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path $dstRoot | Out-Null

          # Copy one file through an explicit handle opened with
          # FileShare.ReadWrite. This is the "shared read" fallback: a server
          # still appending to its own log keeps FILE_SHARE_READ|WRITE, so this
          # open succeeds where a plain File.Copy (which asks for exclusive
          # access) would fail with EBUSY. On a genuine sharing violation we
          # retry a few times and then skip the file without failing the step.
          function Copy-Shared {
            param([string]$Source, [string]$Destination)
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              $inStream = $null
              $outStream = $null
              try {
                $dir = Split-Path -Parent $Destination
                if (-not (Test-Path -LiteralPath $dir)) {
                  New-Item -ItemType Directory -Force -Path $dir | Out-Null
                }
                $inStream = [System.IO.File]::Open(
                  $Source,
                  [System.IO.FileMode]::Open,
                  [System.IO.FileAccess]::Read,
                  [System.IO.FileShare]::ReadWrite)
                $outStream = [System.IO.File]::Create($Destination)
                $inStream.CopyTo($outStream)
                return 'copied'
              } catch {
                $lastError = $_.Exception.Message
                Start-Sleep -Milliseconds (400 * $attempt)
              } finally {
                if ($outStream) { $outStream.Dispose() }
                if ($inStream)  { $inStream.Dispose() }
              }
            }
            Write-Host ("[collect]   LOCKED, skipped (shared read failed): {0} :: {1}" -f $Source, $lastError)
            return 'locked'
          }

          $copied = 0
          $locked = 0
          foreach ($f in $candidates) {
            $relative = $f.FullName.Substring($srcRoot.Length).TrimStart('\', '/')
            $destination = Join-Path $dstRoot $relative
            if ((Copy-Shared -Source $f.FullName -Destination $destination) -eq 'copied') {
              $copied++
            } else {
              $locked++
            }
          }

          # --- 3. report count + total size ----------------------------------
          $copiedFiles = @(Get-ChildItem -LiteralPath $dstRoot -Recurse -File -Force -ErrorAction SilentlyContinue)
          $totalBytes = ($copiedFiles | Measure-Object -Property Length -Sum).Sum
          if (-not $totalBytes) { $totalBytes = 0 }
          Write-Host ('[collect] copied {0} file(s), {1:N2} MB total ({2} locked/skipped), into {3}' -f `
            $copiedFiles.Count, ($totalBytes / 1MB), $locked, $dstRoot)
          if ($locked -gt 0) {
            Write-Host ('[collect] WARNING: {0} file(s) stayed locked after the process kill; they are missing from the artifact.' -f $locked)
          }
          # Top-level sanity check for the artifact step that follows.
          if ($copiedFiles.Count -eq 0) {
            Write-Host '[collect] WARNING: no diagnostic files were copied; the artifact will be empty.'
          }

      # ---------------------------------------------------------------------
      # On failure (or cancellation), upload the clean directory built above:
      # per-platform server/backend/bot logs, plugin-build logs, bot results and
      # the run summary -- and nothing else. The upload no longer walks the run
      # directories, so it cannot trip over a live server's *.jar or a
      # memory-mapped world region file.
      #
      # include-hidden-files: true is REQUIRED, not cosmetic. The whole tree
      # lives under `.e2e-artifacts`, a dot-prefixed (hidden) directory, and
      # actions/upload-artifact@v4 excludes hidden files by default
      # (excludeHiddenFiles = !includeHiddenFiles, default false). The previous
      # pattern therefore matched nothing at all and every failed run uploaded
      # 0 artifacts -- run 39056124289 has 10 failed/succeeded jobs and 0
      # artifacts, with "No files were found with the provided path:
      # .e2e-artifacts/" in each job log.
      # ---------------------------------------------------------------------
      - name: Upload E2E artifacts on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.platform }}-${{ github.run_id }}
          path: .e2e-artifacts/logs-only/
          include-hidden-files: true
          # warn (not ignore): if a job dies before writing anything, an
          # annotation saying so is the diagnostic, not noise.
          if-no-files-found: warn
          retention-days: 7

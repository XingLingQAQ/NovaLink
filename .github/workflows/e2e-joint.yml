name: E2E (Joint Servers)

on:
  workflow_dispatch:
    inputs:
      proxies:
        description: Proxy cases to run (unselected jobs are skipped)
        type: choice
        default: velocity,bungee
        options: ["velocity,bungee", velocity, bungee]
      modes:
        description: Joint modes to run
        type: choice
        default: relay,lite
        options: ["relay,lite", relay, lite]
      bedrock:
        description: Bedrock servers to cover in relay mode
        type: choice
        default: nukkit,pnx
        options: ["nukkit,pnx", nukkit, pnx]
      scenario_groups:
        description: "CSV: core,business,lite-moderation,recovery,proxy-switch,channel-lifecycle,social-contract,custom-effects,completion (core is always included)"
        type: string
        default: core
      secondary_java_platform:
        description: Second Bukkit downstream (required for proxy-switch or channel-lifecycle)
        type: choice
        default: none
        options: [none, bukkit]
      require_render_coordination:
        description: Require authenticated proxy/Bukkit rendering (relay + custom-effects)
        type: boolean
        default: false
      require_render_effects:
        description: Require coordinated item, mention and private-message game evidence
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: e2e-joint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  joint:
    if: contains(inputs.proxies, 'velocity') && (contains(inputs.modes, 'lite') || contains(inputs.bedrock, 'nukkit'))
    name: Joint Velocity + Bukkit (${{ matrix.mode }})
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        proxy: [velocity]
        mode: ${{ fromJSON((inputs.modes == 'lite' || !contains(inputs.bedrock, 'nukkit')) && '["lite"]' || inputs.modes == 'relay' && '["relay"]' || '["relay","lite"]') }}
        bedrock: [nukkit]
    env: &joint-env
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
      JOINT_SCENARIO_GROUPS: ${{ inputs.scenario_groups }}
      JOINT_SECONDARY_JAVA: ${{ inputs.secondary_java_platform }}
      JOINT_REQUIRE_RENDER_COORDINATION: ${{ inputs.require_render_coordination }}
      JOINT_REQUIRE_RENDER_EFFECTS: ${{ inputs.require_render_effects }}
      JOINT_ROOT: ${{ github.workspace }}/.e2e-artifacts/joint-ci/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.proxy }}-${{ matrix.mode }}-${{ matrix.mode == 'relay' && matrix.bedrock || 'none' }}
      JOINT_EVIDENCE: ${{ github.workspace }}/.e2e-artifacts/joint-evidence/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.proxy }}-${{ matrix.mode }}-${{ matrix.mode == 'relay' && matrix.bedrock || 'none' }}

    steps: &joint-steps
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse joint scripts with Windows PowerShell
        shell: powershell
        run: ./test/joint/verify-joint-syntax.ps1 -Path ./test/joint

      - name: Validate selected scenario topology before starting servers
        shell: powershell
        env:
          JOINT_MODE: ${{ matrix.mode }}
          JOINT_PROXY: ${{ matrix.proxy }}
        run: |
          . ./test/joint/scenarios/registry.ps1
          $groups = @(Resolve-JointScenarioGroups -Value $env:JOINT_SCENARIO_GROUPS)
          $null = Get-JointScenarioAssertionIds -ScenarioGroups $groups -RoundIndex 1 -Mode $env:JOINT_MODE -Proxy $env:JOINT_PROXY
          if ($env:JOINT_REQUIRE_RENDER_EFFECTS -eq 'true' -and $env:JOINT_REQUIRE_RENDER_COORDINATION -ne 'true') {
            throw 'require_render_effects requires require_render_coordination'
          }
          if ($env:JOINT_REQUIRE_RENDER_COORDINATION -eq 'true' -and
              ($env:JOINT_MODE -ne 'relay' -or 'custom-effects' -notin $groups)) {
            throw 'require_render_coordination requires relay mode and custom-effects'
          }
          if ('proxy-switch' -in $groups -and $env:JOINT_SECONDARY_JAVA -ne 'bukkit') {
            throw 'proxy-switch requires secondary_java_platform=bukkit'
          }
          if ('channel-lifecycle' -in $groups -and $env:JOINT_SECONDARY_JAVA -ne 'bukkit') {
            throw 'channel-lifecycle requires secondary_java_platform=bukkit'
          }

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: test/bot/package-lock.json

      - name: Install locked bot dependencies
        shell: pwsh
        run: npx --yes npm@10 ci --prefix test/bot --no-audit --no-fund

      - name: Check bot and scenario machinery without servers
        shell: powershell
        run: |
          node --check test/joint/bots/joint-bot.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./test/joint/run-joint.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./test/joint/verify-joint-scenarios.ps1
          . ./test/joint/scenarios/registry.ps1
          $groups = @(Resolve-JointScenarioGroups -Value $env:JOINT_SCENARIO_GROUPS)
          foreach ($group in @('channel-lifecycle', 'social-contract', 'custom-effects', 'completion')) {
            if ($group -in $groups) {
              & "./test/joint/scenarios/verify-$group.ps1"
            }
          }
          if ($env:JOINT_REQUIRE_RENDER_COORDINATION -eq 'true') {
            ./test/joint/scenarios/verify-render-coordination.ps1
          }
          if ($env:JOINT_REQUIRE_RENDER_EFFECTS -eq 'true') {
            ./test/joint/scenarios/verify-render-effects.ps1
          }

      - name: Cache server distributions
        uses: actions/cache@v4
        with:
          path: .e2e-artifacts/dist
          key: joint-dist-${{ runner.os }}-${{ hashFiles('test/versions.lock.ps1') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: joint-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            joint-gradle-${{ runner.os }}-

      - name: Run joint servers and require recorded evidence
        shell: powershell
        env:
          JOINT_MODE: ${{ matrix.mode }}
          JOINT_PROXY: ${{ matrix.proxy }}
          JOINT_BEDROCK: ${{ matrix.bedrock }}
        run: |
          $platforms = if ($env:JOINT_MODE -eq 'relay') { "$env:JOINT_PROXY,bukkit,$env:JOINT_BEDROCK" } else { "$env:JOINT_PROXY,bukkit" }
          $serverLimit = if ($env:JOINT_SECONDARY_JAVA -eq 'bukkit') { 4 } else { 3 }
          $coordination = $env:JOINT_REQUIRE_RENDER_COORDINATION -eq 'true'
          $renderEffects = $env:JOINT_REQUIRE_RENDER_EFFECTS -eq 'true'
          ./test/joint/run-joint.ps1 -Platforms $platforms -Rounds 1 -MaxConcurrentServers $serverLimit -ProxyMode $env:JOINT_MODE -JointRoot $env:JOINT_ROOT -ScenarioGroups $env:JOINT_SCENARIO_GROUPS -SecondaryJavaPlatform $env:JOINT_SECONDARY_JAVA -RequireRenderCoordination:$coordination -RequireRenderEffects:$renderEffects -KeepArtifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./test/joint/assert-joint-ci.ps1 -JointRoot $env:JOINT_ROOT -ProxyMode $env:JOINT_MODE -ProxyPlatform $env:JOINT_PROXY -BedrockPlatform $env:JOINT_BEDROCK -ScenarioGroups $env:JOINT_SCENARIO_GROUPS -SecondaryJavaPlatform $env:JOINT_SECONDARY_JAVA -RequireRenderCoordination:$coordination -RequireRenderEffects:$renderEffects

      - name: Collect joint evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:JOINT_EVIDENCE | Out-Null
          ./test/joint/export-verifier.ps1 -Destination (Join-Path $env:JOINT_EVIDENCE 'verifier')
          $root = [IO.Path]::GetFullPath($env:JOINT_ROOT).TrimEnd([char[]]'\/')
          $share = [IO.FileShare]::ReadWrite -bor [IO.FileShare]::Delete
          foreach ($file in @(Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue)) {
            $relative = $file.FullName.Substring($root.Length + 1)
            if ($relative -match '(^|[\\/])world[^\\/]*[\\/]' -or $file.Name -match '^\d+\.log$') { continue }
            if ($file.Name -notlike '*.log' -and $file.Name -notlike '*.results.json' -and $file.Name -ne 'joint-summary.json' -and $file.Name -ne 'admin-requests.json' -and $file.Name -notlike 'plan-*.json') { continue }
            $destination = Join-Path $env:JOINT_EVIDENCE $relative
            $source = $null
            $target = $null
            try {
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              $source = [IO.File]::Open($file.FullName, [IO.FileMode]::Open, [IO.FileAccess]::Read, $share)
              $target = [IO.File]::Create($destination)
              $source.CopyTo($target)
            } catch {
              Write-Warning "Evidence copy skipped ${relative}: $($_.Exception.Message)"
            } finally {
              if ($target) { $target.Dispose() }
              if ($source) { $source.Dispose() }
            }
          }

      - name: Upload joint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-${{ matrix.proxy }}-${{ matrix.mode }}-${{ matrix.mode == 'relay' && matrix.bedrock || 'none' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.JOINT_EVIDENCE }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  joint-bungee:
    if: contains(inputs.proxies, 'bungee') && (contains(inputs.modes, 'lite') || contains(inputs.bedrock, 'nukkit'))
    name: Joint Bungee + Bukkit (${{ matrix.mode }})
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        proxy: [bungee]
        mode: ${{ fromJSON((inputs.modes == 'lite' || !contains(inputs.bedrock, 'nukkit')) && '["lite"]' || inputs.modes == 'relay' && '["relay"]' || '["relay","lite"]') }}
        bedrock: [nukkit]
    env: *joint-env
    steps: *joint-steps

  joint-pnx:
    if: contains(inputs.modes, 'relay') && contains(inputs.bedrock, 'pnx')
    name: Joint ${{ matrix.proxy }} + Bukkit + PNX 3 (relay)
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        proxy: ${{ fromJSON(inputs.proxies == 'velocity' && '["velocity"]' || inputs.proxies == 'bungee' && '["bungee"]' || '["velocity","bungee"]') }}
        mode: [relay]
        bedrock: [pnx]
    env: *joint-env
    steps: *joint-steps

# NovaLink release -- build every platform artifact and publish a GitHub Release.
#
# TRIGGER: pushing a version tag (v1.2.3, v1.2.3-rc1, ...). Nothing else runs
# this workflow, so a release is always an explicit, deliberate act:
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
# The tag is the single source of truth for the version: the leading "v" is
# stripped and passed to Gradle as -Pversion, which overrides the
# 1.0.0-SNAPSHOT default in gradle.properties for every module at once -- so
# the jars, the plugin descriptors (plugin.yml / bungee.yml / nukkit.yml), and
# the release title all agree without editing any file.
#
# WHY A WINDOWS RUNNER (same reasoning as nova-ci.yml):
#   levilamina is a Windows-only C++20 BDS shared library built with xmake +
#   MSVC; it cannot cross-compile to ubuntu. Java/Python/PHP all build fine on
#   Windows too, so one windows-2022 runner covers the whole monorepo and the
#   release assets are produced from the same toolchain CI already validates.
#
# FAIL-CLOSED: a release is published only if the full test suite passes. A
# red tag therefore produces no (possibly broken) release -- the tag stays,
# and re-running the workflow after a fix publishes it.
name: Release

on:
  push:
    tags:
      # GitHub tag filters are GLOB patterns (minimatch), not regex: '+' is a
      # literal plus, so a regex-flavoured 'v[0-9]+.[0-9]+.[0-9]+*' matches
      # nothing at all and the release would never fire. '[0-9]*' is the glob
      # spelling of "starts with a digit" and rejects non-version tags such as
      # 'vfoo'. The version step below re-validates strictly and fails the run
      # with a clear message if a tag somehow slips through.
      - 'v[0-9]*.[0-9]*.[0-9]*'

  # Manual run for validating the pipeline WITHOUT cutting a tag. Defaults to a
  # dry run: every build/package step executes and the asset set is uploaded as
  # a workflow artifact, but no GitHub Release is published. Set dry_run=false
  # to publish from a manual run.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, semver without the leading v (e.g. 1.2.3)'
        required: true
      dry_run:
        description: 'Build and validate artifacts, but do not publish a release'
        type: boolean
        default: true

# A release must be able to create the GitHub Release and upload assets.
permissions:
  contents: write

# One release per tag; never cancel a publish midway (a half-uploaded release
# is worse than a queued one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate: the Panel is built + linted on ubuntu (cheap, and matches nova-ci).
  # Its dist/ is uploaded as a release asset for operators who deploy the web
  # console separately from the backend jar.
  # ---------------------------------------------------------------------------
  panel:
    name: Panel lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Panel/web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Panel/web/package-lock.json

      - name: Install Panel dependencies from lock
        run: npm ci --no-audit --no-fund

      - name: Lint Panel
        run: npm run lint

      - name: Build Panel
        run: npm run build

      - name: Package Panel dist
        run: |
          cd dist
          zip -qr "${GITHUB_WORKSPACE}/panel-web.zip" .
          ls -la "${GITHUB_WORKSPACE}/panel-web.zip"

      - name: Upload Panel dist
        uses: actions/upload-artifact@v4
        with:
          name: release-panel
          path: panel-web.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build every platform artifact, publish the GitHub Release, attach assets.
  # ---------------------------------------------------------------------------
  release:
    name: Build + publish release
    needs: panel
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      # UTF-8 hardening -- mirrors nova-ci.yml. The Chinese-asserting tests
      # (ConsoleCommandTest, BackendI18nTest) and non-ASCII sources need a UTF-8
      # JVM because windows-2022's system locale is not UTF-8.
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
      PYTHONUTF8: '1'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
      # Testcontainers' Ryuk reaper fails to start on Windows Docker Desktop,
      # which hangs every @Testcontainers test in container-startup. Ryuk is
      # only a cleanup helper and the runner is destroyed afterwards anyway.
      TESTCONTAINERS_RYUK_DISABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Derive the version once, up front, and export it to later steps.
      # Tag push: `v1.2.3` -> `1.2.3`. Manual run: the `version` input is used
      # as-is. Kept in one place so the Gradle build and the release metadata
      # can never disagree. Validated strictly (semver, with optional
      # -prerelease / +build): the workflow's tag glob is deliberately loose, so
      # this is the gate that rejects a malformed tag loudly instead of
      # publishing a release whose version nobody can parse.
      - name: Derive version
        id: version
        shell: pwsh
        run: |
          $manual = "${{ github.event.inputs.version }}"
          if ($manual) {
            $ver = $manual
            $source = "workflow_dispatch input"
          } else {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
              Write-Error "Tag '$tag' is not a semantic version tag (expected v<major>.<minor>.<patch>[-pre][+build])."
              exit 1
            }
            $ver = $Matches[1]
            $source = "tag $tag"
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            Write-Error "Version '$ver' is not semver (expected <major>.<minor>.<patch>[-pre][+build])."
            exit 1
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Releasing version: $ver (from $source)"

      - name: Set up JDK 21 (primary) and JDK 25 (velocity toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sockets, mbstring, openssl
          coverage: none

      - name: Set up MSVC (VS 2022)
        uses: microsoft/setup-msbuild@v2

      # xmake is pinned to 3.0.9 for the same reason as nova-ci.yml: 3.1.0
      # breaks this action's own packageskey cache step.
      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'
        continue-on-error: true

      - name: Verify xmake is on PATH
        shell: pwsh
        run: |
          if (-not (Get-Command xmake -ErrorAction SilentlyContinue)) {
            Write-Error "xmake is not on PATH after setup-xmake step"
            exit 1
          }
          xmake --version

      - name: Cache xmake packages (levilamina SDK + deps)
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\.xmake
          key: xmake-pkgs-win2022-md-${{ hashFiles('NovaChat/Bedrock/levilamina/xmake.lua') }}
          restore-keys: |
            xmake-pkgs-win2022-md-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'settings.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache MOD loom / NeoForm workspaces
        uses: actions/cache@v4
        with:
          path: |
            NovaChat/MOD/neoforge/build/neoForm
            NovaChat/MOD/fabric/build/loom-cache
            NovaChat/MOD/quilt/build/loom-cache
          key: mod-loom-${{ runner.os }}-${{ hashFiles('NovaChat/MOD/**/build.gradle', 'NovaChat/MOD/**/gradle.properties') }}
          restore-keys: |
            mod-loom-${{ runner.os }}-

      # -----------------------------------------------------------------------
      # Build + test everything at the tag's version. `build test` is the same
      # gate nova-ci runs, so a tag can only publish code that has passed the
      # full suite. -Pversion makes every artifact carry the release version.
      # -----------------------------------------------------------------------
      - name: Build and test all platforms
        shell: pwsh
        run: |
          chcp 65001
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          ./gradlew build test --console=plain `
            '-Pversion=${{ steps.version.outputs.version }}' `
            '-Dfile.encoding=UTF-8' `
            '-Dconsole.encoding=UTF-8' `
            '-Porg.gradle.java.installations.paths=' `
            '-Dorg.gradle.java.installations.paths='

      # -----------------------------------------------------------------------
      # Assemble the release asset set. Each platform's build task is invoked
      # explicitly so a missing artifact fails the release instead of silently
      # shipping an incomplete set.
      # -----------------------------------------------------------------------
      - name: Build release artifacts
        shell: pwsh
        run: |
          chcp 65001
          $OutputEncoding = [System.Text.Encoding]::UTF8
          ./gradlew --console=plain `
            ':StarLink:core:shadowJar' `
            ':NovaChat:Plugin:bukkit:jar' `
            ':NovaChat:Plugin:folia:shadowJar' `
            ':NovaChat:Proxy:velocity:jar' `
            ':NovaChat:Proxy:bungee:jar' `
            ':NovaChat:Bedrock:nukkit:jar' `
            ':NovaChat:Bedrock:pnx:shadowJar' `
            ':NovaChat:Sponge:sponge:shadowJar' `
            '-Pversion=${{ steps.version.outputs.version }}' `
            '-Porg.gradle.java.installations.paths=' `
            '-Dorg.gradle.java.installations.paths='

      # Package the PHP plugin into a .phar. PocketMine-MP 5.x's
      # PharPluginLoader only accepts .phar files (there is no folder loader),
      # so a plain source directory would be silently ignored at runtime.
      #
      # Staged explicitly instead of pointing the builder at the module dir:
      # that directory also holds vendor/ (composer's pocketmine-mp checkout,
      # phpunit, phpstan) which is gitignored, absent on a fresh runner unless
      # something installs it, and would otherwise bundle ~48 MB of dev
      # dependencies into the shipped plugin. plugin.yml + src + resources is
      # the complete runtime payload (~0.3 MB).
      - name: Package PHP (PocketMine-MP) plugin phar
        shell: pwsh
        run: |
          $stage = "build/pmmp-phar-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "NovaChat/Bedrock/pmmp/plugin.yml" $stage
          Copy-Item "NovaChat/Bedrock/pmmp/src" "$stage/src" -Recurse
          if (Test-Path "NovaChat/Bedrock/pmmp/resources") {
            Copy-Item "NovaChat/Bedrock/pmmp/resources" "$stage/resources" -Recurse
          }
          New-Item -ItemType Directory -Force -Path dist-assets | Out-Null
          php -d phar.readonly=0 test/bin/build-plugin-phar.php $stage dist-assets/NovaChat-PMMP.phar
          if (-not (Test-Path dist-assets/NovaChat-PMMP.phar)) {
            Write-Error "PMMP phar was not produced"
            exit 1
          }
          Get-Item dist-assets/NovaChat-PMMP.phar | Select-Object Name, Length | Format-Table -AutoSize

      # Collect every artifact into dist-assets/ with stable, version-stamped
      # names so the release page is readable and links stay predictable.
      - name: Collect artifacts
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path dist-assets | Out-Null

          # core-<ver>-all.jar is the runnable fat backend jar.
          Copy-Item "StarLink/core/build/libs/core-$ver-all.jar" "dist-assets/NovaLink-core-$ver-all.jar"
          Copy-Item "NovaChat/Plugin/bukkit/build/libs/bukkit-$ver.jar" "dist-assets/NovaChat-Bukkit-$ver.jar"
          Copy-Item "NovaChat/Plugin/folia/build/libs/NovaChat-Folia-$ver.jar" "dist-assets/NovaChat-Folia-$ver.jar"
          Copy-Item "NovaChat/Proxy/velocity/build/libs/velocity-$ver.jar" "dist-assets/NovaChat-Velocity-$ver.jar"
          Copy-Item "NovaChat/Proxy/bungee/build/libs/bungee-$ver.jar" "dist-assets/NovaChat-BungeeCord-$ver.jar"
          Copy-Item "NovaChat/Bedrock/nukkit/build/libs/nukkit-$ver.jar" "dist-assets/NovaChat-Nukkit-$ver.jar"
          Copy-Item "NovaChat/Bedrock/pnx/build/libs/NovaChat-PNX-$ver.jar" "dist-assets/NovaChat-PowerNukkitX-$ver.jar"
          Copy-Item "NovaChat/Sponge/sponge/build/libs/NovaChat-Sponge-$ver.jar" "dist-assets/NovaChat-Sponge-$ver.jar"

          # LeviLamina ships a folder (dll + manifest + resources), not a jar.
          # Zip it so the release has one downloadable unit per platform.
          # The .pdb (27 MB of MSVC debug symbols) is excluded: it is not needed
          # to run the plugin and would dominate the asset size.
          $leviSrc = "NovaChat/Bedrock/levilamina/bin/novachat-levilamina"
          if (-not (Test-Path "$leviSrc/novachat-levilamina.dll")) {
            Write-Error "levilamina dll not found at $leviSrc -- was the xmake build skipped?"
            exit 1
          }
          $leviStage = "build/levilamina-release"
          New-Item -ItemType Directory -Force -Path $leviStage | Out-Null
          Get-ChildItem $leviSrc -Exclude "*.pdb" | Copy-Item -Destination $leviStage -Recurse -Force
          Compress-Archive -Path "$leviStage/*" `
            -DestinationPath "dist-assets/NovaChat-LeviLamina-$ver.zip" -Force

          Get-ChildItem dist-assets | Select-Object Name, Length | Format-Table -AutoSize

      # Endstone (Python) ships as source: there is no compiled artifact, the
      # loader imports the package directly. Staged from an explicit file list
      # (not the module dir, which holds a venv + __pycache__ + .hypothesis),
      # and the two manifests that carry a version literal are rewritten to the
      # tag's version so the release is internally consistent.
      - name: Package Python (Endstone) plugin
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $src = "NovaChat/Bedrock/endstone"
          $stage = "build/endstone-release"
          $stageInner = "$stage/novachat-endstone"
          New-Item -ItemType Directory -Force -Path $stageInner | Out-Null
          Copy-Item "$src/novachat_endstone" "$stageInner/novachat_endstone" -Recurse
          Copy-Item "$src/plugin.toml" $stageInner
          Copy-Item "$src/pyproject.toml" $stageInner
          foreach ($f in @("$stageInner/plugin.toml", "$stageInner/pyproject.toml")) {
            $text = (Get-Content $f -Raw) -replace '(?m)^version\s*=\s*"[^"]*"', "version = `"$ver`""
            # Write UTF-8 with no BOM explicitly: a BOM at the head of a TOML
            # file can break strict parsers, and .NET's default encoding choices
            # differ between Windows PowerShell 5.1 and PowerShell 7.
            [System.IO.File]::WriteAllText(
              (Resolve-Path $f).Path, $text, (New-Object System.Text.UTF8Encoding($false)))
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "dist-assets/NovaChat-Endstone-$ver.zip" -Force
          Get-Item "dist-assets/NovaChat-Endstone-$ver.zip" | Select-Object Name, Length | Format-Table -AutoSize

      - name: Download Panel dist
        uses: actions/download-artifact@v4
        with:
          name: release-panel

      - name: Move Panel dist into assets
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          Move-Item panel-web.zip "dist-assets/NovaChat-Panel-Web-$ver.zip" -Force
          Get-ChildItem dist-assets | Select-Object Name | Format-Table -AutoSize

      # -----------------------------------------------------------------------
      # Publish. generate_release_notes appends GitHub's auto-generated
      # changelog (merged PRs / commits since the previous tag), so the notes do
      # not have to be maintained by hand. fail_on_unmatched_files makes an
      # empty/typo'd asset glob fail loudly rather than publish a bare release.
      #
      # Skipped on a manual dry run, where the artifacts are uploaded as a
      # workflow artifact instead (next step) so the packaging can be inspected
      # without creating a public release.
      # -----------------------------------------------------------------------
      - name: Publish GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          name: NovaLink ${{ steps.version.outputs.version }}
          # On a tag push, github.ref_name IS the tag. On a manual publish the
          # ref is a branch, so the tag has to be constructed from the version
          # -- otherwise the release would be created against the branch name.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: dist-assets/*
          fail_on_unmatched_files: true

      # Dry-run (and post-publish) view of exactly what would be/was attached.
      - name: Upload release assets as workflow artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ steps.version.outputs.version }}
          path: dist-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports-${{ github.run_id }}
          path: |
            **/build/reports/
            **/build/test-results/
            NovaChat/Bedrock/levilamina/build/
          if-no-files-found: ignore
          retention-days: 7

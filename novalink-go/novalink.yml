# ==========================================
# Sensitive Word Filter / 敏感词过滤
# ==========================================
filter:
  # Enable sensitive word filtering / 启用敏感词过滤
  enabled: true
  
  # Custom sensitive words (in addition to built-in list)
  # 自定义敏感词（除内置列表外）
  custom_words: []
  
  # Regex patterns for filtering / 过滤用正则表达式
  patterns: []
  
  # Replacement character / 替换字符
  replacement: "***"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novachat-endstone"
version = "1.0.0"
description = "NovaChat plugin for Endstone - Cross-server chat integration for Minecraft Bedrock Edition"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "NovaChat Team" }
]
keywords = ["minecraft", "bedrock", "endstone", "chat", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "endstone>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["novachat_endstone"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.hypothesis]
max_examples = 100

plugins {
    id 'java'
}

// Shared ext properties for all projects
allprojects {
    ext {
        architecturyVersion = '9.1.12'
        fabricLoaderVersion = '0.14.24'
        fabricApiVersion = '0.97.1+1.20.4'
        neoforgeVersion = '20.4.237'
        quiltLoaderVersion = '0.21.2'
        quiltMappingsVersion = '1.20.4+build.1'
        forgeVersion = '1.20.4-49.0.50'
        minecraftVersion = '1.20.4'
        
        nettyVersion = '4.1.100.Final'
        snakeYamlVersion = '2.2'
        gsonVersion = '2.10.1'
        slf4jVersion = '2.0.9'
        logbackVersion = '1.4.14'
        
        junitVersion = '5.10.1'
        jqwikVersion = '1.8.2'
        assertjVersion = '3.24.2'
    }
}

// Configure only non-loom subprojects
subprojects {
    // Skip fabric module - it uses fabric-loom plugin
    // Skip neoforge module - it uses neoforged.gradle.userdev plugin
    // Skip quilt module - it uses fabric-loom plugin with Quilt
    // Skip forge module - it uses ForgeGradle plugin
    if (project.name == 'fabric' || project.name == 'neoforge' || project.name == 'quilt' || project.name == 'forge') {
        return
    }
    
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.neoforged.net/releases' }
        maven { url 'https://maven.quiltmc.org/repository/release' }
        maven { url 'https://files.minecraftforge.net/maven' }
        maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    }

    dependencies {
        // Testing
        testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        testImplementation "net.jqwik:jqwik:${jqwikVersion}"
        testImplementation "org.assertj:assertj-core:${assertjVersion}"
    }

    tasks.named('test') {
        useJUnitPlatform {
            includeEngines 'junit-jupiter', 'jqwik'
        }
        testLogging {
            events "passed", "skipped", "failed"
        }
    }
}

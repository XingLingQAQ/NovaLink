plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.80'
    id 'maven-publish'
}

// Version configurations for multi-version builds
// NeoForge only supports Minecraft 1.20.2 and above
// Each configuration targets a specific Minecraft version range
// Version pins as of 2026-07 (Maven: maven.neoforged.net)
ext {
    // Current build target (can be overridden via -PmcVersion=1.21.11)
    targetMcVersion = project.hasProperty('mcVersion') ? project.mcVersion : '1.21.11'

    // Version-specific configurations for NeoForge
    // NeoForge version format for 1.21.x: 21.<patch>.x ; for 26.x: 26.<minor>.x
    versionConfigs = [
        // Calendar-line versions (2026+)
        '26.2'  : [neoforgeVersion: '26.2.0.37-beta', javaVersion: 21],
        '26.1.2': [neoforgeVersion: '26.1.2.87', javaVersion: 21],

        // 1.21.x versions
        '1.21.11': [neoforgeVersion: '21.11.44', javaVersion: 21],
        '1.21.10': [neoforgeVersion: '21.10.64', javaVersion: 21],
        '1.21.8' : [neoforgeVersion: '21.8.54', javaVersion: 21],
        '1.21.4' : [neoforgeVersion: '21.4.157', javaVersion: 21],
        '1.21.3' : [neoforgeVersion: '21.3.0-beta', javaVersion: 21],
        '1.21.1' : [neoforgeVersion: '21.1.244', javaVersion: 21],
        '1.21'   : [neoforgeVersion: '21.0.0-beta', javaVersion: 21],

        // 1.20.5-1.20.6 versions (with data components)
        '1.20.6': [neoforgeVersion: '20.6.0-beta', javaVersion: 21],
        '1.20.5': [neoforgeVersion: '20.5.0-beta', javaVersion: 21],

        // 1.20.2-1.20.4 versions (NBT-based items)
        '1.20.4': [neoforgeVersion: '20.4.237', javaVersion: 17],
        '1.20.3': [neoforgeVersion: '20.3.0-beta', javaVersion: 17],
        '1.20.2': [neoforgeVersion: '20.2.0-beta', javaVersion: 17]
    ]

    // Get config for target version
    currentConfig = versionConfigs[targetMcVersion] ?: versionConfigs['1.21.11']

    // Determine Java version based on MC version
    targetJavaVersion = currentConfig.javaVersion ?: 21
}

version = "${project.version}+mc${targetMcVersion}"
group = 'com.nova.chat.mod'

base {
    archivesName = "novachat-neoforge"
}

java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
    
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases' }
    maven { url 'https://maven.architectury.dev/' }
}

dependencies {
    // NeoForge - use version from config or fallback to parent project
    def neoforgeVer = currentConfig.neoforgeVersion ?: project(':novachat-mod').ext.neoforgeVersion
    implementation "net.neoforged:neoforge:${neoforgeVer}"
    
    // Common module
    implementation project(':novachat-mod:common')
    
    // Netty (for network client)
    implementation "io.netty:netty-all:${project(':novachat-mod').ext.nettyVersion}"
    
    // YAML parsing
    implementation "org.yaml:snakeyaml:${project(':novachat-mod').ext.snakeYamlVersion}"
    
    // JSON parsing
    implementation "com.google.code.gson:gson:${project(':novachat-mod').ext.gsonVersion}"
    
    // Logging
    implementation "org.slf4j:slf4j-api:${project(':novachat-mod').ext.slf4jVersion}"
    
    // NovaChat common protocol
    implementation project(':novachat-common')
}

runs {
    server {
        workingDirectory project.file('run')
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", targetMcVersion
    inputs.property "neoforge_version", currentConfig.neoforgeVersion

    filesMatching("META-INF/mods.toml") {
        expand(
            "version": project.version,
            "minecraft_version": targetMcVersion,
            "neoforge_version": currentConfig.neoforgeVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = targetJavaVersion
}

tasks.named('jar') {
    manifest {
        attributes([
            'Specification-Title': 'NovaChat',
            'Specification-Vendor': 'NovaChat Team',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'NovaChat Team',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'Minecraft-Version': targetMcVersion,
            'NeoForge-Version-Range': getNeoForgeVersionRange(targetMcVersion)
        ])
    }
}

// Helper method to determine NeoForge version range
def getNeoForgeVersionRange(String mcVersion) {
    def parts = mcVersion.split('\\.')
    def major = parts.length > 0 ? parts[0].toInteger() : 1
    def minor = parts.length > 1 ? parts[1].toInteger() : 0
    def patch = parts.length > 2 ? parts[2].toInteger() : 0

    if (major == 26) {
        return '26.x'
    } else if (minor == 21) {
        return '1.21.x'
    } else if (minor == 20 && patch >= 5) {
        return '1.20.5-1.20.6'
    } else {
        return '1.20.2-1.20.4'
    }
}

// Task to build all supported NeoForge versions
tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Builds the mod for all supported NeoForge Minecraft versions (1.20.2+ / 26.x)'
    
    doLast {
        versionConfigs.keySet().each { version ->
            println "Building for Minecraft ${version} (NeoForge)..."
            exec {
                workingDir projectDir
                commandLine 'gradle', 'build', "-PmcVersion=${version}"
            }
        }
    }
}

// Task to build 1.20.2-1.20.4 versions (NBT-based)
tasks.register('build1_20_2Versions') {
    group = 'build'
    description = 'Builds the mod for NeoForge 1.20.2-1.20.4 (NBT-based items)'
    
    doLast {
        ['1.20.2', '1.20.3', '1.20.4'].each { version ->
            if (versionConfigs.containsKey(version)) {
                println "Building for Minecraft ${version} (NeoForge)..."
                exec {
                    workingDir projectDir
                    commandLine 'gradle', 'build', "-PmcVersion=${version}"
                }
            }
        }
    }
}

// Task to build 1.20.5-1.20.6 versions (Data Components)
tasks.register('build1_20_5Versions') {
    group = 'build'
    description = 'Builds the mod for NeoForge 1.20.5-1.20.6 (Data Components)'
    
    doLast {
        ['1.20.5', '1.20.6'].each { version ->
            if (versionConfigs.containsKey(version)) {
                println "Building for Minecraft ${version} (NeoForge)..."
                exec {
                    workingDir projectDir
                    commandLine 'gradle', 'build', "-PmcVersion=${version}"
                }
            }
        }
    }
}

// Task to build 1.21.x versions
tasks.register('build1_21Versions') {
    group = 'build'
    description = 'Builds the mod for NeoForge 1.21.x'
    
    doLast {
        versionConfigs.keySet().findAll { it.startsWith('1.21') }.each { version ->
            println "Building for Minecraft ${version} (NeoForge)..."
            exec {
                workingDir projectDir
                commandLine 'gradle', 'build', "-PmcVersion=${version}"
            }
        }
    }
}

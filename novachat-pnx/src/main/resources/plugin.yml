name: NovaChat
version: ${version}
main: com.nova.chat.pnx.NovaChatPNX
api: ["2.0.0"]
description: Cross-server chat channel system for PowerNukkitX Bedrock
author: Nova Team
website: https://github.com/nova/novachat

# ==========================================
# Version Compatibility
# ==========================================
# Supported PowerNukkitX API: 2.0.0+
# Supported Minecraft Bedrock: 1.20+
# NovaProtocol version: 1
# Minimum Java version: 17
# ==========================================

commands:
  novachat:
    description: NovaChat main command
    usage: /<command> [subcommand] [args]
    aliases: [nc]

permissions:
  novachat.admin:
    description: Client administrator permission
    default: op
  novachat.bypass.world:
    description: Bypass world restrictions for channels
    default: op
  novachat.channel.*:
    description: Access to all channels
    default: false
  novachat.channel.global:
    description: Access to global channel
    default: true
  novachat.create:
    description: Create private channels
    default: true
  novachat.invite:
    description: Invite players to channels
    default: true

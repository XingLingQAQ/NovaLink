plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://repo.opencollab.dev/maven-snapshots' }
    maven { url 'https://repo.opencollab.dev/maven-releases' }
    maven { url 'https://jitpack.io' }
    // PowerNukkitX repository
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

// PowerNukkitX version - using JitPack for reliable access
ext {
    powernukkitxVersion = '2.0.0-SNAPSHOT'
}

dependencies {
    // Common Module - reuse protocol implementation
    implementation project(':novachat-common')
    // Shared client runtime (Architecture B — not used by novalink-core)
    implementation project(':novachat-client-core')

    // Netty for network communication
    implementation "io.netty:netty-all:${nettyVersion}"

    // Utilities
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    // PowerNukkitX API - using Nukkit API (compatible base)
    // PowerNukkitX extends Nukkit, so we use Nukkit API for compilation
    compileOnly "cn.nukkit:nukkit:${nukkitVersion}"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "net.jqwik:jqwik:${jqwikVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
}

tasks.named('test') {
    useJUnitPlatform {
        includeEngines 'junit-jupiter', 'jqwik'
    }
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Shadow JAR configuration for fat jar packaging
shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('NovaChat-PNX')
    
    // Relocate dependencies to avoid conflicts
    relocate 'io.netty', 'com.nova.chat.pnx.libs.netty'
    relocate 'com.google.gson', 'com.nova.chat.pnx.libs.gson'
    
    // Exclude unnecessary files
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    
    dependencies {
        // Include novachat-common
        include(project(':novachat-common'))
        // Include shared client helpers (PasswordHasher / ClientConnectionConfig)
        include(project(':novachat-client-core'))
        // Include runtime dependencies
        include(dependency('io.netty:.*'))
        include(dependency('com.google.code.gson:gson'))
    }
}

// Make build depend on shadowJar
build.dependsOn shadowJar

// Process resources to replace version placeholder
processResources {
    filesMatching('plugin.yml') {
        expand(
            'version': project.version
        )
    }
}

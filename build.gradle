plugins {
    id 'java'
}

allprojects {
    group = 'com.nova'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral() {
            content {
                excludeGroup 'net.fabricmc'
                excludeGroup 'net.fabricmc.fabric-api'
            }
        }
        maven {
            url 'https://maven.fabricmc.net/'
            content {
                includeGroup 'net.fabricmc'
                includeGroup 'net.fabricmc.fabric-api'
            }
        }
        maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
        maven { url 'https://repo.opencollab.dev/maven-snapshots' }
        maven { url 'https://repo.opencollab.dev/maven-releases' }
        maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    }
}

subprojects {
    // Non-Java Bedrock client modules (PHP/Python/C++) use the base plugin and
    // delegate to their native toolchains. Skip the Java plugin + dependencies
    // for them so `gradle build` works across the whole monorepo.
    def nonJavaBedrock = ['endstone', 'levilamina', 'pmmp']
    if (nonJavaBedrock.contains(project.name)) {
        return
    }

    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    ext {
        nettyVersion = '4.1.100.Final'
        hikariCpVersion = '5.1.0'
        mysqlVersion = '8.0.33'
        postgresVersion = '42.7.4'
        sqliteVersion = '3.45.1.0'
        jedisVersion = '5.1.0'
        snakeYamlVersion = '2.2'
        gsonVersion = '2.10.1'
        slf4jVersion = '2.0.9'
        logbackVersion = '1.4.14'
        lombokVersion = '1.18.46'
        guavaVersion = '32.1.3-jre'
        junitVersion = '5.10.1'
        jqwikVersion = '1.8.2'
        assertjVersion = '3.24.2'
        mockitoVersion = '5.18.0'
        jjwtVersion = '0.12.3'
        // Minecraft Java platform compile targets (as of 2026-08)
        // Calendar line 26.2 is the latest stable line; classic 1.21.11 line remains
        // available as a fallback. Spigot, Paper, and Folia all publish 26.x coords.
        //
        // Verified GAVs via repo.papermc.io maven-metadata.xml + artifact POMs:
        //   org.spigotmc:spigot-api            26.2-R0.1-SNAPSHOT      (latest snapshot, timestamped jars present)
        //   io.papermc.paper:paper-api         26.2.build.112-stable   (latest stable release)
        //   dev.folia:folia-api                26.1.2.build.8-stable   (latest stable Folia release; 26.2 only beta)
        //
        // NOTE: Paper 26.x and Folia 26.x Gradle module metadata declares
        // org.gradle.jvm.version=25, so the folia module is compiled with JDK 25.
        // Spigot 26.2-R0.1-SNAPSHOT targets Java 17 (maven.compiler.release=17).
        spigotVersion = '26.2-R0.1-SNAPSHOT'
        paperVersion = '26.2.build.112-stable'
        foliaVersion = '26.1.2.build.8-stable'
        velocityVersion = '4.1.0-SNAPSHOT'
        bungeecordVersion = '1.21-R0.4'
        nukkitVersion = '1.0-SNAPSHOT'
        testcontainersVersion = '1.19.3'
    }

    dependencies {
        // Testing
        testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        testImplementation "net.jqwik:jqwik:${jqwikVersion}"
        testImplementation "org.assertj:assertj-core:${assertjVersion}"
    }

    tasks.named('test') {
        useJUnitPlatform {
            includeEngines 'junit-jupiter', 'jqwik'
        }
        testLogging {
            events "passed", "skipped", "failed"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }
}

// ============================================================================
// Real-server E2E harness integration (OPTIONAL -- never runs by default).
//
// The committed E2E harness lives under test/. Runtime downloads and logs live
// under .e2e-artifacts/ and remain separate from the source tree. The harness
// requires real Minecraft servers, bot processes, JDK 17/21/25, and Node.js,
// so execution is opt-in; harness integrity is never optional once requested.
//
// Entry points:
//   1. Harness-only preflight: ./gradlew verifyRealE2EHarness
//   2. Dedicated task:         ./gradlew realE2E
//   3. Gate into check:        ./gradlew check -PenableRealE2E=true
//
// Platform subset:
//   ./gradlew realE2E -Pe2ePlatforms=bukkit,velocity
//   (default: bukkit,bungee,velocity,nukkit,folia,pnx,sponge)
// ============================================================================

def e2eOrchestrator = file('test/bin/run-e2e-orchestrator.ps1')
def e2eSummaryFile = file('.e2e-artifacts/runs/e2e-summary.json')
def e2eRequiredPaths = [
    'test/README.md',
    'test/versions.lock.ps1',
    'test/conf/novalink.template.yml',
    'test/bot/package.json',
    'test/bot/package-lock.json',
    'test/bot/run-e2e.js',
    'test/bot/run-e2e-bedrock.js',
    'test/bin/build-plugin-phar.php',
    'test/bin/fetch-server.ps1',
    'test/bin/write-classpath.init.gradle',
    'test/bin/verify-orchestration-paths.ps1',
    'test/bin/run-e2e-orchestrator.ps1',
    'test/bin/run-bukkit-e2e.ps1',
    'test/bin/run-endstone-e2e.ps1',
    'test/bin/run-levilamina-e2e.ps1',
    'test/bin/run-pmmp-e2e.ps1',
    'test/bin/multiplatform/run-multiplatform-e2e.ps1',
    'test/bin/multiplatform/start-backend.ps1',
    'test/bin/multiplatform/start-server.ps1'
]
def defaultE2ePlatforms = 'bukkit,bungee,velocity,nukkit,folia,pnx,sponge'

tasks.register('verifyRealE2EHarness') {
    group = 'verification'
    description = 'Fails unless every committed real-server E2E harness input exists under test/.'
    inputs.files(e2eRequiredPaths.collect { file(it) })

    doLast {
        def missing = e2eRequiredPaths.findAll { !file(it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                '[verifyRealE2EHarness] Required committed harness files are missing:\n  - ' +
                missing.join('\n  - ')
            )
        }
        logger.lifecycle('[verifyRealE2EHarness] PASS: test/bin/run-e2e-orchestrator.ps1 and all required harness inputs exist.')
    }
}

tasks.register('realE2E', Exec) {
    group = 'verification'
    description = 'Runs the real-server E2E harness under test/ (opt-in; missing committed inputs fail the task).'
    dependsOn('verifyRealE2EHarness')

    // This task is NEVER included in build/check/test by default.
    // It is only pulled into check when -PenableRealE2E=true is passed.

    // Resolve platform subset property (default = all 7 platforms).
    def platforms = providers.gradleProperty('e2ePlatforms').orElse(defaultE2ePlatforms).get()

    // Timeout: E2E runs take minutes per platform (server boot + bot sequence).
    // Default 30 min total; override with -Pe2eTimeoutSec=600.
    def timeoutSec = providers.gradleProperty('e2eTimeoutSec').orElse('1800').get().toInteger()

    workingDir = rootProject.projectDir
    commandLine 'powershell.exe',
        '-ExecutionPolicy', 'Bypass',
        '-NoProfile',
        '-File', e2eOrchestrator.absolutePath,
        '-Platforms', platforms,
        '-TimeoutSec', '420',
        '-BotWaitSec', '150'
    timeout = java.time.Duration.ofSeconds(timeoutSec)
    // ignoreExitValue defaults to false: platform and prerequisite failures
    // both fail the Gradle task.

    doFirst {
        logger.lifecycle('[realE2E] Orchestrator: ' + e2eOrchestrator)
        logger.lifecycle('[realE2E] Starting real-server E2E for platforms: ' + platforms)
        logger.lifecycle('[realE2E] Timeout: ' + timeoutSec + 's. This will spawn real server + bot processes.')
        logger.lifecycle('[realE2E] Results summary: ' + e2eSummaryFile)
    }

    doLast {
        if (e2eSummaryFile.exists()) {
            logger.lifecycle('[realE2E] --- Results Summary ---')
            def summaryJson = e2eSummaryFile.text
            try {
                def parsed = groovy.json.JsonSlurper.newInstance().parseText(summaryJson)
                if (parsed instanceof List) {
                    parsed.each { row ->
                        def l1 = row.l1Pass ? 'PASS' : 'FAIL'
                        def chat = row.chatRoundTrip ? 'MATCH' : 'NO-MATCH'
                        def line = String.format('  %-10s | L1: %-4s | chat: %-9s | %s',
                            row.platform, l1, chat, row.status)
                        logger.lifecycle(line)
                        if (row.notes) {
                            logger.lifecycle('             | notes: ' + row.notes)
                        }
                    }
                }
            } catch (Exception e) {
                logger.lifecycle('[realE2E] Could not parse summary JSON: ' + e.message)
                logger.lifecycle(summaryJson)
            }
        }
    }
}

// Gate: only include realE2E in check when -PenableRealE2E=true is passed.
// Plain `gradlew check` does NOT run E2E.
tasks.named('check') {
    def enableE2E = providers.gradleProperty('enableRealE2E').map { it == 'true' }.orElse(false).get()
    if (enableE2E) {
        dependsOn('realE2E')
    }
}

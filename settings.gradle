pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.neoforged.net/releases' }
        maven { url 'https://maven.quiltmc.org/repository/release' }
    }
}

rootProject.name = 'nova-parent'

include 'NovaChat:common'
include 'NovaChat:client-core'
// The storage layer is split out of :StarLink:core so that a slim,
// proxy-hosted chat plugin can depend on persistence alone (no Netty/auth/
// network/websocket/JWT, no :NovaChat:common). Package names are preserved.
include 'StarLink:storage'
include 'StarLink:core'
// Embedded backend host for Paper/Purpur (Bukkit) servers. Lives in
// StarLink/plugin/bukkit on disk, but -- exactly like :NovaChat:Proxy:proxy-common
// -- its Gradle project name must differ from the leaf name it shares with
// another subproject: :NovaChat:Plugin:bukkit is already the project "bukkit",
// and Gradle disambiguates project dependencies by leaf name, so a second
// project called "bukkit" would make project(':NovaChat:Plugin:bukkit') resolve
// onto this module. "novalink-bukkit" stays unique across the whole build.
include 'StarLink:plugin:novalink-bukkit'
project(':StarLink:plugin:novalink-bukkit').projectDir = file('StarLink/plugin/bukkit')
include 'NovaChat:Plugin:bukkit'
include 'NovaChat:Proxy:velocity'
include 'NovaChat:Proxy:bungee'
// Platform-agnostic proxy layer shared by velocity + bungee (chat core, command
// core, server-switch core, config model, 12 state accessors, dispatcher
// callbacks). Lives in NovaChat/Proxy/common on disk, but -- exactly like
// :NovaChat:MOD:mod-common above -- its Gradle project name must differ from
// :NovaChat:common. Gradle disambiguates project dependencies by leaf name, so
// two projects named "common" make project(':NovaChat:common') resolve onto this
// module itself (compileJava -> compileJava circular dependency).
include 'NovaChat:Proxy:proxy-common'
project(':NovaChat:Proxy:proxy-common').projectDir = file('NovaChat/Proxy/common')
// Wire format + identity rules for the sub-server <-> proxy plugin messaging
// channel (novachat:main). Deliberately tiny and dependency-free apart from
// :NovaChat:common so BOTH sides can share one codec: the proxy plugins and the
// Bukkit sub-server plugin (which must not inherit the proxy layers).
include 'NovaChat:Proxy:channel'
include 'NovaChat:Bedrock:nukkit'
// Shared mod sources (version detection, common networking).
include 'NovaChat:MOD'
include 'NovaChat:MOD:mod-common'
// The mod shared layer lives in NovaChat/MOD/common on disk, but its Gradle
// project name must differ from :NovaChat:common -- Gradle disambiguates project
// dependencies by leaf name, so two projects named "common" make project(':NovaChat:common')
// resolve onto :NovaChat:MOD:common itself (compileJava->jar->classes cycle).
project(':NovaChat:MOD:mod-common').projectDir = file('NovaChat/MOD/common')
// Loader subprojects pull Minecraft jars at configuration time
// (fabric-loom 1.17.x for fabric/quilt, neoforged.gradle.userdev 7.1.x for
// neoforge). They build against the shared client-core-backed common layer
// alongside the seven server-side platforms.
include 'NovaChat:MOD:fabric'
include 'NovaChat:MOD:neoforge'
include 'NovaChat:MOD:quilt'
include 'NovaChat:Bedrock:pnx'
include 'NovaChat:Plugin:folia'
include 'NovaChat:Sponge:sponge'

// Non-Java Bedrock client modules (PHP/Python/C++). These use the base plugin
// and delegate to their native toolchains via Exec tasks. They are excluded
// from the root subprojects { apply plugin: 'java' } block in build.gradle.
include 'NovaChat:Bedrock:endstone'
include 'NovaChat:Bedrock:levilamina'
include 'NovaChat:Bedrock:pmmp'

name: E2E (Environment Game Paths)

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Comma-separated cases (tls-trusted,tls-untrusted,mysql,postgresql,redis)
        default: tls-trusted,tls-untrusted,mysql,postgresql,redis
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-environment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  environment:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      ENVIRONMENT_ROOT: ${{ github.workspace }}/.e2e-artifacts/environment
      ENVIRONMENT_CASES: ${{ inputs.cases }}
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: test/bot/package-lock.json
      - name: Install TLS and native bot tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl openssl build-essential cmake
      - name: Check runtime tools and selected cases
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or newer is required' }
          foreach ($tool in @('node', 'openssl', 'curl', 'docker')) {
            $null = Get-Command $tool -CommandType Application -ErrorAction Stop
          }
          node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Node 24 is required' }
          openssl version
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL is unavailable' }
          $curlVersion = curl --version
          if ($LASTEXITCODE -ne 0 -or ($curlVersion -join "`n") -notmatch '(?im)^Protocols:.*\bhttps\b') { throw 'curl with HTTPS support is required' }
          $curlVersion | Write-Host
          $javaVersion = & "$env:JAVA_HOME/bin/java" -version 2>&1
          if ($LASTEXITCODE -ne 0 -or ($javaVersion -join "`n") -notmatch 'version "21[.]') { throw 'JAVA_HOME must select JDK 21' }
          $selected = @($env:ENVIRONMENT_CASES.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          ./test/environment/run-environment.ps1 -Cases $selected -PlanOnly
          if ($LASTEXITCODE -ne 0) { throw 'Invalid environment case selection' }
      - name: Install locked game bot libraries
        run: |
          npx --yes npm@10 ci --prefix test/bot --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked bot dependency installation failed' }
      - name: Prepare locked game server runtime
        run: ./test/environment/prepare-runtime.ps1 -RepoRoot $env:GITHUB_WORKSPACE
      - name: Build required runtime artifacts
        shell: bash
        run: >-
          bash ./gradlew :StarLink:core:shadowJar :NovaChat:Plugin:bukkit:shadowJar
          :NovaChat:MOD:fabric:fabricE2eJar
          :StarLink:storage:environmentStorageProbeClasspath
          --init-script test/bin/fabric-fatjar.init.gradle
          --init-script test/bin/environment-storage.init.gradle
          -Porg.gradle.java.installations.paths= -Dorg.gradle.java.installations.paths=
          -x test --console=plain --no-daemon
      - name: Run actual game TLS and storage paths
        run: |
          $selected = @($env:ENVIRONMENT_CASES.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          ./test/environment/run-environment.ps1 -Cases $selected -RepoRoot $env:GITHUB_WORKSPACE -OutputRoot $env:ENVIRONMENT_ROOT -Jdk21 $env:JAVA_HOME -ProvisionDatabases
          exit $LASTEXITCODE
      - name: Package and independently verify evidence
        if: always()
        run: |
          $verifier = Join-Path $env:ENVIRONMENT_ROOT 'ci/public/verifier'
          New-Item -ItemType Directory -Path $verifier -Force | Out-Null
          foreach ($file in @('assert-artifacts.ps1', 'storage-probe.ps1', 'evidence-checks.ps1', 'cases.psd1')) {
            Copy-Item -LiteralPath (Join-Path 'test/environment' $file) -Destination $verifier
          }
          $selected = @($env:ENVIRONMENT_CASES.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          & (Join-Path $verifier 'assert-artifacts.ps1') -EvidenceRoot $env:ENVIRONMENT_ROOT -Cases $selected
      - name: Record workflow outcome
        if: always()
        env:
          ENVIRONMENT_JOB_STATUS: ${{ job.status }}
        run: |
          $directory = Join-Path $env:ENVIRONMENT_ROOT 'ci/public'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          @{ jobStatus = $env:ENVIRONMENT_JOB_STATUS; verification = 'workflow-status-only' } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $directory 'workflow-status.json') -Encoding utf8
      - name: Upload filtered environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-game-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e-artifacts/environment/**/public/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

// ============================================================================
// fabric-fatjar.init.gradle -- package a runnable Fabric server MOD jar for E2E.
//
// WHY THIS EXISTS
//   NovaChat/MOD/fabric/build.gradle builds `fabric-<version>.jar` through
//   fabric-loom's remapJar. That artifact contains ONLY the loader shim
//   (com/nova/chat/mod/fabric/**, fabric.mod.json, novachat.yml) -- it has no
//   dependencies block that shades the shared layers, and fabric-loom does not
//   add them either. Dropping it into a real Fabric server's mods/ directory
//   fails at startup with:
//     java.lang.ClassNotFoundException: com.nova.chat.mod.platform.Platform
//     ...provided by 'novachat' at 'com.nova.chat.mod.fabric.NovaChatFabric'!
//   (verified 2026-10-18 against Minecraft 1.21.11 + Fabric Loader 0.19.3).
//
//   The per-platform harness never hit this because it never started Fabric;
//   the joint harness does, so the mod must be assembled into a self-contained
//   jar first. This script is an INIT SCRIPT (passed with `--init-script`) on
//   purpose: the repository build files are owned by another change stream and
//   must not be edited for an E2E-only packaging need. It adds a task, it does
//   not modify `remapJar` or any existing task.
//
// WHAT GOES IN
//   * the remapped loader jar (this module) -- keeps fabric.mod.json at the root
//   * :NovaChat:MOD:mod-common  -- shared mod runtime (config, commands, chat)
//   * :NovaChat:client-core      -- channel state, i18n, network client
//   * :NovaChat:common           -- protocol packets/codec
//   * snakeyaml                  -- NOT shipped by the Minecraft server jar
//                                   (checked: 1.21.11 server carries gson and
//                                   netty but no org/yaml/snakeyaml)
//   Deliberately NOT bundled (the host already provides them, and duplicating
//   them without relocation risks version skew):
//     gson   -- MC 1.21.11 ships com/google/gson 2.13.2
//     netty  -- MC 1.21.11 ships io/netty 4.2.7.Final
//     slf4j  -- MC 1.21.11 ships org/slf4j 2.0.17
//
// USAGE
//   ./gradlew :NovaChat:MOD:fabric:fabricE2eJar \
//       --init-script test/bin/fabric-fatjar.init.gradle
//   Output: NovaChat/MOD/fabric/build/libs/nova-chat-fabric-e2e-<version>.jar
// ============================================================================
import org.gradle.api.tasks.bundling.Jar

// ---------------------------------------------------------------------------
// Rewrites the packaged fabric.mod.json so a "server" entrypoint that cannot
// satisfy Fabric's DedicatedServerModInitializer requirement is dropped.
//
// Reads the descriptor + the entrypoint class out of the already-built jar,
// checks whether the class references the required interface, and rewrites the
// descriptor IN PLACE only when it does not. Returns true when a rewrite
// happened, so the caller can log it as a workaround rather than a silent
// mutation.
//
// Declared as a CLOSURE, not a `def` method: an init script's top-level methods
// live on the script class, and a `doLast { }` block resolves bare calls
// against the TASK as its delegate, so `patchBrokenServerEntrypoint(...)` is
// not found there ("Could not find method ... on task ':NovaChat:MOD:fabric:...").
// A closure variable captured lexically by the task closure works on both.
// ---------------------------------------------------------------------------
def patchBrokenServerEntrypoint = { File jarFile ->
    if (!jarFile.isFile()) {
        throw new GradleException("fabricE2eJar: archive missing: ${jarFile}")
    }
    def zip = new java.util.zip.ZipFile(jarFile)
    try {
        def descriptorEntry = zip.getEntry('fabric.mod.json')
        if (descriptorEntry == null) {
            return false
        }
        def descriptor = zip.getInputStream(descriptorEntry).getText('UTF-8')
        def json = new groovy.json.JsonSlurper().parseText(descriptor)
        def serverEntry = json.entrypoints != null ? json.entrypoints.server : null
        if (serverEntry == null || serverEntry.isEmpty()) {
            return false
        }

        // Collect entrypoint class names ("a.b.C" or "a.b.C::method").
        def classNames = []
        serverEntry.each { value ->
            def text = value instanceof List ? value.join(' ') : String.valueOf(value)
            def m = (text =~ /([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)+)/)
            m.each { classNames << it[0] }
        }
        if (classNames.isEmpty()) {
            return false
        }

        // Only patch when at least one server entrypoint class demonstrably does
        // NOT implement DedicatedServerModInitializer. Scanning the class bytes
        // for the interface name is sufficient: an implementing class carries
        // that internal name in its constant pool.
        boolean broken = classNames.any { cn ->
            def entry = zip.getEntry(cn.replace('.', '/') + '.class')
            if (entry == null) {
                return false   // unresolvable here; leave the descriptor alone
            }
            def text = new String(zip.getInputStream(entry).getBytes(), 'ISO-8859-1')
            return !text.contains('net/fabricmc/api/DedicatedServerModInitializer')
        }
        if (!broken) {
            return false
        }

        // Rebuild the archive without the "server" entrypoint, copying every
        // other entry through unchanged.
        json.entrypoints.remove('server')
        // Groovy's prettyPrint takes a JSON STRING, not a Map (the Map overload
        // only exists on the newer JsonGenerator API). Serialize first.
        def patched = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + '\n'

        // Read every entry into memory and CLOSE the ZipFile before touching the
        // original path: on Windows a move over a file that still has an open
        // handle fails with "the process cannot access the file because it is
        // being used by another process".
        def entries = []
        zip.entries().each { e ->
            if (!e.isDirectory()) {
                entries << [name: e.name, bytes: zip.getInputStream(e).getBytes()]
            }
        }
        zip.close(); zip = null

        def tmp = new File(jarFile.parentFile, jarFile.name + '.tmp')
        def out = new java.util.zip.ZipOutputStream(new FileOutputStream(tmp))
        try {
            out.setLevel(9)
            entries.each { e ->
                out.putNextEntry(new java.util.zip.ZipEntry(e.name))
                out.write(e.name == 'fabric.mod.json' ? patched.getBytes('UTF-8') : e.bytes)
                out.closeEntry()
            }
        } finally {
            out.close()
        }
        java.nio.file.Files.move(tmp.toPath(), jarFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        println "[fabricE2eJar] WORKAROUND: dropped broken 'server' entrypoint(s) " +
                "(${classNames.join(', ')}) from fabric.mod.json -- the class does not " +
                "implement DedicatedServerModInitializer."
        return true
    } finally {
        if (zip != null) { zip.close() }
    }
}

gradle.projectsLoaded {
    gradle.afterProject { project ->
        if (project.path != ':NovaChat:MOD:fabric') {
            return
        }

        def rootProjectRef = project.rootProject
        def modCommon = rootProjectRef.project(':NovaChat:MOD:mod-common')
        def clientCore = rootProjectRef.project(':NovaChat:client-core')
        def common = rootProjectRef.project(':NovaChat:common')

        project.tasks.register('fabricE2eJar', Jar) {
            group = 'e2e'
            description = 'Self-contained NovaChat Fabric MOD jar for the joint E2E harness.'
            archiveBaseName.set('nova-chat-fabric-e2e')
            archiveClassifier.set('')
            archiveVersion.set(project.provider { project.version.toString() })
            destinationDirectory.set(project.layout.buildDirectory.dir('libs'))
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE

            // remapJar, not jar: the intermediate (unremapped) classes name
            // official Mojang types, which Fabric's runtime will not resolve.
            //
            // Looked up WITHOUT a type argument on purpose: fabric-loom's
            // RemapJarTask is not a subclass of org.gradle.api.tasks.bundling.Jar
            // (asking for it as one fails configuration with "not a subclass of
            // the given type"), but it is an AbstractArchiveTask, so the
            // archiveFile provider is available through the untyped handle.
            dependsOn project.tasks.named('remapJar')
            dependsOn modCommon.tasks.named('jar')
            dependsOn clientCore.tasks.named('jar')
            dependsOn common.tasks.named('jar')

            from { project.zipTree(project.tasks.named('remapJar').get().archiveFile.get().asFile) }
            from project.zipTree(modCommon.tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile)
            from project.zipTree(clientCore.tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile)
            from project.zipTree(common.tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile)

            // snakeyaml is the only third-party library the shared layers need
            // that the server does not already ship. Resolve it from the
            // module's own runtime classpath so the version stays in step with
            // the root build's snakeYamlVersion.
            from {
                project.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                    .findAll { it.moduleVersion.id.group == 'org.yaml' && it.name == 'snakeyaml' }
                    .collect { project.zipTree(it.file) }
            }

            // Signatures from the merged dependency jars would invalidate the
            // resulting archive (the JDK rejects a signed jar whose manifest no
            // longer matches). The merged jar is not signed by us either.
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
            exclude 'META-INF/MANIFEST.MF'
            exclude 'module-info.class'
            exclude 'META-INF/versions/**/module-info.class'

            // ------------------------------------------------------------------
            // PRODUCT BUG WORKAROUND (self-invalidating).
            //
            // fabric.mod.json declares NovaChatFabric under BOTH "main" and
            // "server". Fabric requires a "server" entrypoint to implement
            // net.fabricmc.api.DedicatedServerModInitializer; NovaChatFabric
            // implements only ModInitializer. Loading the mod on a dedicated
            // server therefore dies at boot with:
            //   LanguageAdapterException: Class ...NovaChatFabric cannot be cast
            //   to net.fabricmc.api.DedicatedServerModInitializer!
            // (verified 2026-10-18, MC 1.21.11 / Fabric Loader 0.19.3).
            //
            // The "main" entrypoint already runs onInitialize(), so dropping the
            // broken "server" entrypoint changes nothing except making the mod
            // loadable. The rewrite is applied ONLY when the class genuinely
            // lacks the interface: if the mod is fixed (the class starts
            // referencing DedicatedServerModInitializer), this block does
            // nothing and the descriptor ships untouched. That keeps the
            // workaround from masking a future fix.
            // ------------------------------------------------------------------
            doLast {
                patchBrokenServerEntrypoint(archiveFile.get().asFile)
                logger.lifecycle('[fabricE2eJar] ' + archiveFile.get().asFile.absolutePath)
            }
        }
    }
}

gradle.projectsLoaded {
    gradle.afterProject { project ->
        if (project.path != ':NovaChat:MOD:fabric') {
            return
        }

        def remapJar = project.tasks.named('remapJar')
        project.tasks.register('fabricE2eJar', Copy) {
            group = 'e2e'
            description = 'Copies the production Fabric jar under the legacy E2E filename.'
            dependsOn remapJar
            from(remapJar.flatMap { it.archiveFile })
            into project.layout.buildDirectory.dir('libs')
            rename { "nova-chat-fabric-e2e-${project.version}.jar" }
        }
    }
}

# NovaLink backend config template for E2E.
# gen-config.ps1 instantiates this into a run directory with random ports + a
# generated secret-key. Placeholders use {{TOKEN}} syntax.
server:
  bind-address: 127.0.0.1
  port: {{NOVA_PORT}}
  websocket-port: {{NOVA_WS_PORT}}
  secret-key: "{{SECRET_KEY}}"
  worker-threads: 2
  locale: en_US
  # AUTH-002 fails closed: the backend refuses to start a plaintext TCP
  # listener unless the risk is acknowledged explicitly. E2E runs entirely on
  # loopback against throwaway configs, so plaintext is the intent here -- but
  # it has to be stated, not assumed.
  insecure-allow-plaintext: true

database:
  type: memory

security:
  allowed-ips:
    - 127.0.0.1
  ip-ban-duration: 300

debug: true

global_channels:
  global:
    display_name: "Global"
    permission: "novachat.channel.global"
    # The loader rejects max_capacity <= 0 ("must be greater than 0"), so 0 is
    # not the "unlimited" sentinel here. E2E never approaches this ceiling.
    max_capacity: 1000

clients:
  - username: "E2E_Client"
    password: "{{CLIENT_PASSWORD}}"
    display_name: "E2E"

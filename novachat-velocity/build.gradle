plugins {
    id 'java'
}

// Velocity API requires Java 25. Use a Gradle toolchain so the Velocity
// module is compiled with JDK 25's javac regardless of which JDK runs the
// Gradle daemon. The explicit sourceCompatibility/targetCompatibility =
// VERSION_25 overrides the root subprojects { ... VERSION_17 } defaults so
// dependency attribute matching treats this module's consumer as JVM 25
// (Velocity API publishes org.gradle.jvm.version=25 and would otherwise be
// rejected as incompatible with a JVM 17 consumer).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    // Common Module (protocol only)
    implementation project(':novachat-common')
    // Shared client runtime (Architecture B — not used by novalink-core)
    implementation project(':novachat-client-core')

    // Netty
    implementation "io.netty:netty-all:${nettyVersion}"

    // Utilities (Lombok omitted — velocity source uses no Lombok annotations,
    // and Lombok 1.18.x crashes under JDK 25's annotation-processor SPI)
    implementation "com.google.code.gson:gson:${gsonVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    // Minecraft Platform
    compileOnly "com.velocitypowered:velocity-api:${velocityVersion}"
    annotationProcessor "com.velocitypowered:velocity-api:${velocityVersion}"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "net.jqwik:jqwik:${jqwikVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
}

tasks.named('test') {
    useJUnitPlatform {
        includeEngines 'junit-jupiter', 'jqwik'
    }
    testLogging {
        events "passed", "skipped", "failed"
    }
}

# NovaLink backend messages — Chinese (Simplified, China) — DEFAULT / hard fallback.
# Encoding: UTF-8 (loaded via Utf8Control).
# {0}, {1}, … are MessageFormat placeholders for dynamic values.
# Console output is plain text (no color codes).
#
# To add a new language: drop lang/<locale>.properties into the backend's
# external lang/ dir (next to novalink.yml, e.g. <workdir>/lang/fr_FR.properties)
# OR into the classpath lang/ package of StarLink/core. See I18n class Javadoc.


# NovaChat client messages — English (United States).
# Encoding: UTF-8 (loaded via Utf8Control).
# Color codes (&e, §c, …) stay INSIDE the values; i18n swaps only natural language.
# {0}, {1}, … are MessageFormat placeholders for dynamic values.
# Any key absent here falls back to the zh_CN (default) bundle.
#
# To add a new language: drop lang/<locale>.properties into the plugin's
# external lang/ dir (e.g. plugins/NovaChat/lang/fr_FR.properties) OR into the
# classpath lang/ package of client-core. See I18n class Javadoc for details.


# ==========================================
# NovaChat 插件配置文件
# ==========================================

config-version: 1

# 后端连接设置
backend:
  host: "127.0.0.1"
  port: 8888
  username: "Survival_Server"
  password: "your-password-here"
  reconnect-delay: 5  # 重连延迟（秒）

# 聊天设置
chat:
  replace_vanilla: false  # 是否替换原版聊天
  default_channel: "local"  # 默认频道
  locale: "zh_CN"  # 默认语言 (玩家未上报客户端语言时使用；可选 zh_CN / en_US)
  # 频道前缀（仅 replace_vanilla: true 时生效）：消息以指定前缀开头时直接发往对应频道
  # 例如配置 "!": global 后，输入 "!大家好" 会发送 "大家好" 到 global 频道
  # 用 "\" 转义（"\!文本" 发送字面 "!文本"）；默认空 = 关闭
  channel-prefixes: {}
  #  "!": global
  #  "$": trade

# ==========================================
# 消息格式 (在插件端配置，服主可自定义)
# ==========================================
# 可用变量:
#   {player} - 玩家名称
#   {display_name} - 玩家显示名称
#   {channel} - 频道ID
#   {channel_name} - 频道显示名称
#   {message} - 消息内容
#   {world} - 玩家所在世界
#   {server} - 服务器名称
#   %placeholder% - PlaceholderAPI 变量
# ==========================================
format:
  # 系统消息格式
  prefix: "&8[&bNovaChat&8]&r "
  error: "&c错误: {message}"
  success: "&a成功: {message}"
  
  # 频道消息格式 (按频道ID配置)
  channels:
    # 全局频道格式
    global: "&c[全服] &7{player}&f: {message}"
    
    # 本地频道格式
    local: "&e[本地] &7{player}&f: {message}"
    
    # 资源区频道格式
    resource: "&a[资源] &7{player}&f: {message}"
    
    # PVP 频道格式
    pvp: "&c[PVP] &7{player}&f: {message}"
    
    # 私有频道默认格式
    private_default: "&d[私聊] &7{player}&f: {message}"
  
  # 默认格式 (未配置的频道使用此格式)
  default: "&7[{channel_color}{channel_name}] {player}&f: {message}"

# 调试模式
debug: false

# ==========================================
# NovaChat 插件配置文件
# ==========================================

config-version: 1

# 后端连接设置
backend:
  host: "127.0.0.1"
  port: 8888
  username: "Survival_Server"
  password: "your-password-here"
  reconnect-delay: 5  # 重连延迟（秒）

# 聊天设置
chat:
  replace_vanilla: false  # 是否替换原版聊天
  default_channel: "local"  # 默认频道
  locale: "zh_CN"  # 默认语言 (玩家未上报客户端语言时使用；可选 zh_CN / en_US)
  # 频道前缀（仅 replace_vanilla: true 时生效）：消息以指定前缀开头时直接发往对应频道
  # 例如配置 "!": global 后，输入 "!大家好" 会发送 "大家好" 到 global 频道
  # 用 "\" 转义（"\!文本" 发送字面 "!文本"）；默认空 = 关闭
  channel-prefixes: {}
  #  "!": global
  #  "$": trade

# ==========================================
# 消息格式 (在插件端配置，服主可自定义)
# ==========================================
# 可用变量:
#   {player} - 玩家名称
#   {display_name} - 玩家显示名称
#   {channel} - 频道ID
#   {channel_name} - 频道显示名称
#   {message} - 消息内容
#   {world} - 玩家所在世界
#   {server} - 服务器名称
#   %placeholder% - PlaceholderAPI 变量
# ==========================================
format:
  # 系统消息格式
  prefix: "&8[&bNovaChat&8]&r "
  error: "&c错误: {message}"
  success: "&a成功: {message}"
  
  # 频道消息格式 (按频道ID配置)
  channels:
    # 全局频道格式
    global: "&c[全服] &7{player}&f: {message}"
    
    # 本地频道格式
    local: "&e[本地] &7{player}&f: {message}"
    
    # 资源区频道格式
    resource: "&a[资源] &7{player}&f: {message}"
    
    # PVP 频道格式
    pvp: "&c[PVP] &7{player}&f: {message}"
    
    # 私有频道默认格式
    private_default: "&d[私聊] &7{player}&f: {message}"
  
  # 默认格式 (未配置的频道使用此格式)
  default: "&7[{channel_color}{channel_name}] {player}&f: {message}"

# ==========================================
# 子服 <-> 代理 plugin messaging 通道
# ==========================================
# 通道标识固定为 novachat:main（Velocity / BungeeCord 均接受该格式）。
# 启用后，当后端连接不可用（例如 lite 模式根本没有后端）时，玩家聊天会改由
# 代理转发，代理再通过同一通道把扇出结果发回本服。后端连接可用时保持原路径
# 不变，避免同一句话被投递两次。
plugin-messaging:
  enabled: true
  # 本服在代理配置中的服务器名（velocity.toml [servers] / bungee config.yml
  # 的 servers 下的键）。代理会校验消息里声明的 server id 与实际来源一致，
  # 不一致的消息会被丢弃并告警。留空时回退到 backend.username。
  server-id: ""
  # 代理连接本服时使用的源地址（可选，支持列表）。plugin messaging 只能沿一个
  # 玩家的连接发送，而直连本服（未经代理）的玩家会让消息进入其客户端后消失，
  # 代理永远收不到。本插件优先选用「已证实收到过代理下行包」的玩家；没有这样的
  # 玩家时，用这里的地址匹配（留空即只把回环地址视为代理）。都不匹配时仍会发送，
  # 但会打一次 warn，提示投递无法保证。
  proxy-addresses: []

# 调试模式
debug: false

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    // Common Module (protocol only)
    implementation project(':NovaChat:common')
    // Shared client runtime (Architecture B — not used by StarLink:core)
    implementation project(':NovaChat:client-core')
    // Wire format of the sub-server <-> proxy plugin-messaging channel. Small
    // and layered separately from the proxy plugins so the sub-server ships the
    // codec without inheriting the proxy cores.
    implementation project(':NovaChat:Proxy:channel')

    // Netty
    implementation "io.netty:netty-all:${nettyVersion}"

    // Utilities
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    // Minecraft Platform
    compileOnly "org.spigotmc:spigot-api:${spigotVersion}"
    compileOnly "me.clip:placeholderapi:2.11.5"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "net.jqwik:jqwik:${jqwikVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    // Bukkit platform API on the test classpath so Mockito can mock org.bukkit.*
    // (compileOnly deps are not visible to tests). Mirrors the nukkit module.
    testImplementation "org.spigotmc:spigot-api:${spigotVersion}"
}

tasks.named('test') {
    useJUnitPlatform {
        includeEngines 'junit-jupiter', 'jqwik'
    }
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Substitute ${version} in plugin.yml. Without this the descriptor ships the
// literal token and Bukkit reports the plugin version as "${version}".
// Mirrors the processResources/expand block folia/pnx/sponge already use.
processResources {
    filesMatching('plugin.yml') {
        expand(
            'version': project.version
        )
    }
}

// Fat jar. The plain `jar` task only contains this module's own classes, so the
// plugin failed to load in a real server with
//   InvalidPluginException: NoClassDefFoundError: com/nova/chat/common/protocol/Packet
// -- the Bukkit classloader cannot see the implementation dependencies. folia,
// pnx and sponge already shadow; bukkit was the one Java plugin platform that
// did not, and the E2E harness was the first thing to load it in a server.
shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('bukkit')

    // Relocate dependencies to avoid conflicts with other plugins on the server.
    relocate 'io.netty', 'com.nova.chat.bukkit.libs.netty'
    // Package name, not the Maven groupId: Gson's classes live in
    // com.google.gson, so 'com.google.code.gson' never matched anything and
    // this relocation silently did nothing (folia/pnx/sponge already use the
    // correct form).
    relocate 'com.google.gson', 'com.nova.chat.bukkit.libs.gson'

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    dependencies {
        include(project(':NovaChat:common'))
        include(project(':NovaChat:client-core'))
        include(project(':NovaChat:Proxy:channel'))
        include(dependency('io.netty:.*'))
        include(dependency('com.google.code.gson:gson'))
    }
}

build.dependsOn shadowJar

// shadowJar writes to the same path as the plain jar (archiveClassifier ''), so
// running both corrupts the ZIP. The fat jar is the artifact; drop the thin one.
jar.enabled = false

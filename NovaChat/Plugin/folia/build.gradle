plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

java {
    // Folia API 26.1.2+ is published with org.gradle.jvm.version=25 (Gradle
    // module metadata), so the toolchain must target JVM 25 to satisfy variant
    // selection. Runtime consumes still target JDK 21+ servers (Folia itself
    // ships a JDK 25 runtime). The toolchain block mirrors :NovaChat:Proxy:velocity
    // and lets Gradle auto-detect a JDK 25 install (setup-java on CI, scoop on
    // dev) so the daemon JVM does NOT have to be JDK 25 itself.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    // Common Module
    implementation project(':NovaChat:common')
    // Shared client runtime (Architecture B — not used by StarLink:core)
    implementation project(':NovaChat:client-core')

    // Netty
    implementation "io.netty:netty-all:${nettyVersion}"

    // Utilities
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    // Minecraft Platform - Folia API (Paper-based with region threading)
    // Latest stable Folia API as of 2026-08: dev.folia:folia-api 26.1.2.build.8-stable
    compileOnly "dev.folia:folia-api:${foliaVersion}"
    
    // PlaceholderAPI
    compileOnly "me.clip:placeholderapi:2.11.5"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "net.jqwik:jqwik:${jqwikVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    // Platform API on the test classpath so Mockito can mock org.bukkit.* /
    // Folia types (compileOnly keeps it out of the shaded artifact; tests need
    // it resolvable). Mirrors the nukkit module's testImplementation approach.
    testImplementation "dev.folia:folia-api:${foliaVersion}"
}

tasks.named('test') {
    useJUnitPlatform {
        includeEngines 'junit-jupiter', 'jqwik'
    }
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Shadow JAR configuration for fat jar packaging
shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('NovaChat-Folia')
    
    // Relocate dependencies to avoid conflicts
    relocate 'io.netty', 'com.nova.chat.folia.libs.netty'
    relocate 'com.google.gson', 'com.nova.chat.folia.libs.gson'
    
    // Exclude unnecessary files
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    
    dependencies {
        // Include common
        include(project(':NovaChat:common'))
        include(project(':NovaChat:client-core'))
        // Include runtime dependencies
        include(dependency('io.netty:.*'))
        include(dependency('com.google.code.gson:gson'))
    }
}

// Make build depend on shadowJar
build.dependsOn shadowJar

// shadowJar uses archiveClassifier.set('') so it writes the same output path
// as the plain `jar` task (NovaChat-Folia-<ver>.jar). Running both in parallel
// during `build` corrupts the ZIP ("Could not add META-INF to ZIP"). The fat
// jar is the intended artifact, so disable the thin plain jar.
jar.enabled = false

// Process resources to replace version placeholder
processResources {
    filesMatching('plugin.yml') {
        expand(
            'version': project.version
        )
    }
}

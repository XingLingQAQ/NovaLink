# JUnit Platform Configuration for NovaChat Folia Tests

# Enable jqwik property-based testing engine
junit.jupiter.testinstance.lifecycle.default = per_class

# jqwik configuration
jqwik.tries.default = 100
jqwik.maxDiscardRatio = 10
jqwik.reporting.onlyFailures = false
jqwik.edgeCases.mode = MIXIN

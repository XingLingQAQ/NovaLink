# ==========================================
# NovaChat Velocity 配置文件
# ==========================================
# Version Compatibility:
#   Supported Velocity versions: 3.0+ (compile target: velocity-api 3.4.0-SNAPSHOT)
#   NovaProtocol version: 1
#   Minimum Java version: 17
# ==========================================

config-version = 1

# 运行模式 / Operating mode
#   relay - 连接外部 NovaLink 后端（默认；与旧版本行为一致）
#   lite  - 不连接后端，由代理自身提供聊天
# 模板默认必须保持 relay：升级旧配置时更新器会把 mode 写回用户文件，
# 默认写成 lite 会让升级用户静默断开后端。
mode = "relay"

# 调试模式
debug = false

# 后端连接设置（仅 mode = "relay" 时必填并在启动时校验）
[backend]
host = "127.0.0.1"
port = 8888
username = ""
password = ""
reconnect-delay = 5  # 重连延迟（秒）

# 按子服划分的后端身份（仅 mode = "relay" 生效，可省略）。
#
# 键 = 子服在 velocity.toml [servers] 中的名字（plugin-messaging 信封里声明的
#      server id，大小写不敏感）。
# 值 = 该子服在后端 novalink.yml `clients:` 里注册的用户名；后端用它区分
#      “这个玩家在哪台子服”，从而把提及、称号、私聊和 SERVER/PRIVATE 频道
#      投递回正确的子服。
#
# 每个值必须不同（后端同一 clientId 只保留一条连接，重复会互相顶掉），
# 也不能等于 backend.username。密码统一使用上面的 backend.password。
#
# 不给某个子服配置时，它的流量仍走 backend.username 这一条共享连接（旧行为）：
# 只有一个子服的老配置因此无需任何改动。全部子服都配置了身份后，可以把
# backend.username 留空，这样不会多开一条没人使用的连接。
#
# 例如：
#   [backend.identities]
#   survival-01 = "survival-01"   # 后端的 clients: 里要有同名条目
#   creative-02 = "creative-02"
[backend.identities]

# 聊天设置
[chat]
replace_vanilla = false  # 是否替换原版聊天
default_channel = "local"  # 默认频道
locale = "zh_CN"  # 默认语言（zh_CN / en_US）；玩家客户端语言优先

# 频道前缀（仅 replace_vanilla = true 时生效）：消息以指定前缀开头时直接发往对应频道
# 例如配置 "!" = "global" 后，输入 "!大家好" 会发送 "大家好" 到 global 频道
# 用 "\" 转义（"\!文本" 发送字面 "!文本"）；不配置任何条目 = 关闭
[chat.channel-prefixes]
# "!" = "global"
# "$" = "trade"

# ==========================================
# 消息格式 (在插件端配置，服主可自定义)
# ==========================================
# 可用变量:
#   {player} - 玩家名称
#   {display_name} - 玩家显示名称
#   {channel} - 频道ID
#   {channel_name} - 频道显示名称
#   {message} - 消息内容
#   {server} - 服务器名称
# ==========================================
[format]
prefix = "&8[&bNovaChat&8]&r "
error = "&c错误: {message}"
success = "&a成功: {message}"
default = "&7[{channel_color}{channel_name}] {player}&f: {message}"

# 频道消息格式 (按频道ID配置)
[format.channels]
global = "&c[全服] &7{player}&f: {message}"
local = "&e[本地] &7{player}&f: {message}"

# ==========================================
# lite 模式设置 (仅 mode = "lite" 时读取和校验)
# ==========================================
# relay 模式下本节被忽略；模板会保留它，所以 lite 只忽略而不是要求删除。

# 本代理的客户端标识（非空），用于替代 backend.username
[lite]
server-id = "proxy-1"

# 禁言/解禁的权限节点：lite 模式没有后端的权限分级，
# 只有持有 novachat.mute 的玩家（以及控制台）才能禁言。
# 频道自身的 permission 只是"能否加入"，不能用来禁言。

# 本地频道定义
# 字段与后端 novalink.yml 的 global_channels 对齐：
#   display-name  显示名称（可省略，默认取频道 id）
#   permission    加入所需权限节点（可省略 = 无要求）
#   max-capacity  最大成员数，>= 0，0 = 无限制
#   slow-mode     同一玩家两条消息的最小间隔秒数，>= 0，0 = 关闭
# 至少需要一个频道；chat.default_channel 与 chat.channel-prefixes 指向的频道
# 必须都在这里定义。
# 注意：必须写成单个 [lite.channels] 表 + 单行内联表，
# 不能用数组表语法（模板更新器不识别数组表头，用户删除的段会被重新追加）。
[lite.channels]
global = { display-name = "全服", permission = "novachat.channel.global", max-capacity = 1000, slow-mode = 0 }
local = { display-name = "本地", max-capacity = 0, slow-mode = 0 }

# 本地存储（对齐后端 novalink.yml 的 database 段）
#   type: memory | sqlite | mysql | postgresql
# 只有选中的类型对应的段会被校验，其余段可以保留不填。
# 敏感词过滤（可选；缺省 = 关闭）
#   enabled         是否过滤聊天内容
#   custom-words    以逗号分隔的词表，按整词、大小写不敏感匹配
#   custom-patterns 以逗号分隔的正则，大小写不敏感；写错的正则会被跳过
# 命中后统一替换成 ***，与后端 novalink.yml 的 filter 段语义一致。
[lite.filter]
enabled = false
custom-words = ""
custom-patterns = ""
[lite.storage]
type = "memory"

# sqlite：type = "sqlite" 时 file-path 必填
[lite.storage.sqlite]
file-path = "data/novachat.db"

# mysql：type = "mysql" 时 host/database 非空、port 1-65535、pool-size > 0
# username/password 可省略：留空时由数据库服务端决定（与后端 database 段一致）
# ssl-mode 省略时使用驱动的安全默认值（REQUIRED）；显式设成 DISABLED 必须同时把
# allow-plaintext 设为 true，否则存储层会拒绝开启明文连接。
[lite.storage.mysql]
host = "127.0.0.1"
port = 3306
database = "novachat"
username = "novachat"
password = "change-me"
pool-size = 10

# postgresql：type = "postgresql" 时规则同 mysql
[lite.storage.postgresql]
host = "127.0.0.1"
port = 5432
database = "novachat"
username = "novachat"
password = "change-me"
pool-size = 10

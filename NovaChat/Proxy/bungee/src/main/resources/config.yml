# ==========================================
# NovaChat BungeeCord 配置文件
# ==========================================

config-version: 1

# 运行模式 / Operating mode
#   relay - 连接外部 NovaLink 后端（默认；与旧版本行为一致）
#   lite  - 不连接后端，由代理自身提供聊天
# 模板默认必须保持 relay：升级旧配置时更新器会把 mode 写回用户文件，
# 默认写成 lite 会让升级用户静默断开后端。
mode: "relay"

# 后端连接设置（仅 mode: "relay" 时必填并在启动时校验）
backend:
  host: "127.0.0.1"
  port: 8888
  username: ""
  password: ""
  reconnect-delay: 5  # 重连延迟（秒）

# 聊天设置
chat:
  replace_vanilla: false  # 是否替换原版聊天
  default_channel: "local"  # 默认频道
  locale: "zh_CN"  # 默认语言（zh_CN / en_US）；玩家客户端语言优先
  # 频道前缀：消息首字符命中前缀时直接发往对应频道（无需切换频道）。
  # 仅在 REPLACE 模式下生效；前缀可用 "\" 转义（如 "\!..." 按字面发送）。
  # 默认为空 = 关闭。示例：
  # channel-prefixes:
  #   "!": global
  #   "$": trade
  channel-prefixes: {}

# ==========================================
# 消息格式 (在插件端配置，服主可自定义)
# ==========================================
# 可用变量:
#   {player} - 玩家名称
#   {display_name} - 玩家显示名称
#   {channel} - 频道ID
#   {channel_name} - 频道显示名称
#   {message} - 消息内容
#   {server} - 服务器名称
# ==========================================
format:
  prefix: "&8[&bNovaChat&8]&r "
  error: "&c错误: {message}"
  success: "&a成功: {message}"
  default: "&7[{channel_color}{channel_name}] {player}&f: {message}"
  channels:
    global: "&c[全服] &7{player}&f: {message}"
    local: "&e[本地] &7{player}&f: {message}"

# 调试模式
debug: false

# ==========================================
# lite 模式设置 (仅 mode: "lite" 时读取和校验)
# ==========================================
# relay 模式下本节被忽略；模板会保留它，所以 lite 只忽略而不是要求删除。
lite:
  # 本代理的客户端标识（非空），用于替代 backend.username
  server-id: "proxy-1"

  # 禁言/解禁的权限节点：lite 模式没有后端的权限分级，
  # 只有持有 novachat.mute 的玩家（以及控制台）才能禁言。
  # 频道自身的 permission 只是"能否加入"，不能用来禁言。

  # 本地频道定义
  # 字段与后端 novalink.yml 的 global_channels 对齐：
  #   display-name  显示名称（可省略，默认取频道 id）
  #   permission    加入所需权限节点（可省略 = 无要求）
  #   max-capacity  最大成员数，>= 0，0 = 无限制
  #   slow-mode     同一玩家两条消息的最小间隔秒数，>= 0，0 = 关闭
  # 至少需要一个频道；chat.default_channel 与 chat.channel-prefixes 指向的频道
  # 必须都在这里定义。
  channels:
    global:
      display-name: "全服"
      permission: "novachat.channel.global"
      max-capacity: 1000
      slow-mode: 0
    local:
      display-name: "本地"
      max-capacity: 0
      slow-mode: 0

  # 敏感词过滤（可选；缺省 = 关闭）
  #   enabled         是否过滤聊天内容
  #   custom-words    以逗号分隔的词表，按整词、大小写不敏感匹配
  #   custom-patterns 以逗号分隔的正则，大小写不敏感；写错的正则会被跳过
  # 命中后统一替换成 ***，与后端 novalink.yml 的 filter 段语义一致。
  filter:
    enabled: false
    custom-words: ""
    custom-patterns: ""
  # 本地存储（对齐后端 novalink.yml 的 database 段）
  #   type: memory | sqlite | mysql | postgresql
  # 只有选中的类型对应的段会被校验，其余段可以保留不填。
  storage:
    type: "memory"

    # sqlite：type: "sqlite" 时 file-path 必填
    sqlite:
      file-path: "data/novachat.db"

    # mysql：type: "mysql" 时 host/database 非空、port 1-65535、pool-size > 0
    # username/password 可省略：留空时由数据库服务端决定（与后端 database 段一致）
    # ssl-mode 省略时使用驱动的安全默认值（REQUIRED）；显式设成 DISABLED 必须同时
    # 把 allow-plaintext 设为 true，否则存储层会拒绝开启明文连接。
    mysql:
      host: "127.0.0.1"
      port: 3306
      database: "novachat"
      username: "novachat"
      password: "change-me"
      pool-size: 10

    # postgresql：type: "postgresql" 时规则同 mysql
    postgresql:
      host: "127.0.0.1"
      port: 5432
      database: "novachat"
      username: "novachat"
      password: "change-me"
      pool-size: 10

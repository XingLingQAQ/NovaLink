plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // Common Module
    implementation project(':NovaChat:common')
    // Shared client runtime (Architecture B — not used by StarLink:core)
    implementation project(':NovaChat:client-core')

    // Netty
    implementation "io.netty:netty-all:${nettyVersion}"

    // Utilities
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"
    implementation 'org.spongepowered:configurate-hocon:4.2.0'
    implementation 'org.spongepowered:configurate-yaml:4.2.0'

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    // Sponge API 8.x (Minecraft 1.16.5 - 1.20.x) / API 12+ for newer
    // Keep API 8.2.0 as the broadest compile target; runtime supports newer Sponge servers
    compileOnly 'org.spongepowered:spongeapi:8.2.0'

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "net.jqwik:jqwik:${jqwikVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    // Platform API on the test classpath so Mockito can mock org.spongepowered.*
    // types (compileOnly keeps it out of the shaded artifact; tests need it
    // resolvable). Mirrors the nukkit module's testImplementation approach.
    testImplementation 'org.spongepowered:spongeapi:8.2.0'
}

tasks.named('test') {
    useJUnitPlatform {
        includeEngines 'junit-jupiter', 'jqwik'
    }
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Shadow JAR configuration for fat jar packaging
shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('NovaChat-Sponge')
    
    // Relocate dependencies to avoid conflicts
    relocate 'io.netty', 'com.nova.chat.sponge.libs.netty'
    relocate 'com.google.gson', 'com.nova.chat.sponge.libs.gson'
    relocate 'org.spongepowered.configurate', 'com.nova.chat.sponge.libs.configurate'
    relocate 'com.typesafe.config', 'com.nova.chat.sponge.libs.typesafeconfig'
    relocate 'org.yaml.snakeyaml', 'com.nova.chat.sponge.libs.snakeyaml'
    relocate 'io.leangen.geantyref', 'com.nova.chat.sponge.libs.geantyref'
    
    // Exclude unnecessary files
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    
    dependencies {
        // Include common
        include(project(':NovaChat:common'))
        include(project(':NovaChat:client-core'))
        // Include runtime dependencies
        include(dependency('io.netty:.*'))
        include(dependency('com.google.code.gson:gson'))
        include(dependency('org.spongepowered:configurate-.*'))
        include(dependency('com.typesafe:config'))
        include(dependency('org.yaml:snakeyaml'))
        include(dependency('io.leangen.geantyref:geantyref'))
    }
}

// Make build depend on shadowJar
build.dependsOn shadowJar

// shadowJar uses archiveClassifier.set('') so it writes the same output path
// as the plain `jar` task (NovaChat-Sponge-<ver>.jar). Running both in parallel
// during `build` corrupts the ZIP ("Could not add META-INF to ZIP"). The fat
// jar is the intended artifact, so disable the thin plain jar.
jar.enabled = false

// Process resources to replace version placeholder
processResources {
    filesMatching('META-INF/sponge_plugins.json') {
        expand(
            'version': project.version
        )
    }
}

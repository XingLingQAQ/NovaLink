plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // Common Module
    implementation project(':NovaChat:common')
    // Shared client runtime (Architecture B — not used by StarLink:core)
    implementation project(':NovaChat:client-core')

    // Netty
    implementation "io.netty:netty-all:${nettyVersion}"

    // Utilities
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"
    // Configurate MUST stay host-provided. Sponge injects
    // ConfigurationLoader<CommentedConfigurationNode> (@DefaultConfig) into the
    // plugin constructor; if we shade+relocate configurate the plugin's
    // ConfigurationLoader type is a DIFFERENT class from the one Sponge's Guice
    // module binds, and injection fails at plugin construction with
    // "No implementation for ConfigurationLoader<...> annotated with
    // @DefaultConfig(sharedRoot=false) was bound". The SpongeVanilla server
    // already ships configurate-core/-hocon/-yaml/-gson 4.2.0 in libraries/, so
    // compileOnly is both correct and sufficient (same version as the server).
    // Shading it also made the plugin's automatic module export
    // org.spongepowered.configurate.* / io.netty.util.internal, colliding with
    // the server's own modules at module-layer resolution.
    compileOnly 'org.spongepowered:configurate-hocon:4.2.0'
    compileOnly 'org.spongepowered:configurate-yaml:4.2.0'

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    // Sponge API 8.x (Minecraft 1.16.5 - 1.20.x) / API 12+ for newer
    // Keep API 8.2.0 as the broadest compile target; runtime supports newer Sponge servers
    compileOnly 'org.spongepowered:spongeapi:8.2.0'

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "net.jqwik:jqwik:${jqwikVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    // Platform API on the test classpath so Mockito can mock org.spongepowered.*
    // types (compileOnly keeps it out of the shaded artifact; tests need it
    // resolvable). Mirrors the nukkit module's testImplementation approach.
    testImplementation 'org.spongepowered:spongeapi:8.2.0'
}

tasks.named('test') {
    useJUnitPlatform {
        includeEngines 'junit-jupiter', 'jqwik'
    }
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Shadow JAR configuration for fat jar packaging
shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('NovaChat-Sponge')
    
    // Relocate dependencies to avoid conflicts.
    // NOTE: configurate is deliberately NOT relocated and NOT shaded — it is
    // host-provided (see the compileOnly comment in the dependencies block).
    // Relocating it rewrote the types Sponge's Guice binds, so injection of
    // @DefaultConfig ConfigurationLoader<CommentedConfigurationNode> failed.
    relocate 'io.netty', 'com.nova.chat.sponge.libs.netty'
    relocate 'com.google.gson', 'com.nova.chat.sponge.libs.gson'
    relocate 'com.typesafe.config', 'com.nova.chat.sponge.libs.typesafeconfig'
    relocate 'org.yaml.snakeyaml', 'com.nova.chat.sponge.libs.snakeyaml'
    relocate 'io.leangen.geantyref', 'com.nova.chat.sponge.libs.geantyref'
    
    // Exclude unnecessary files
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    // The shaded dependencies ship JPMS descriptors. Shipping them (or the
    // Multi-Release copies under META-INF/versions) makes the plugin jar look
    // like a modular jar whose exports collide with the server's own modules.
    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'

    // Relocation rewrites class files but NOT these ServiceLoader descriptors,
    // so they keep naming the pre-relocation providers. A descriptor that names
    // a class which is not in the jar makes the JVM reject the module outright:
    //   "Provider class org.spongepowered.configurate.hocon.HoconConfigurationFormat
    //    not in JAR file"  ->  "Module format not recognized"
    // which surfaced as
    //   "ResolutionException: Modules novachat and io.netty.common export package
    //    io.netty.util.internal to module org.spongepowered.configurate.gson"
    // Both providers are irrelevant here: configurate is now host-provided, and
    // the plugin never uses Netty's BlockHound integration.
    exclude 'META-INF/services/org.spongepowered.configurate.loader.ConfigurationFormat'
    exclude 'META-INF/services/reactor.blockhound.integration.BlockHoundIntegration'

    dependencies {
        // Include common
        include(project(':NovaChat:common'))
        include(project(':NovaChat:client-core'))
        // Include runtime dependencies. configurate-* is intentionally absent:
        // it is host-provided and must not be shaded (see dependencies block).
        include(dependency('io.netty:.*'))
        include(dependency('com.google.code.gson:gson'))
        include(dependency('org.yaml:snakeyaml'))
    }
}

// Make build depend on shadowJar
build.dependsOn shadowJar

// shadowJar uses archiveClassifier.set('') so it writes the same output path
// as the plain `jar` task (NovaChat-Sponge-<ver>.jar). Running both in parallel
// during `build` corrupts the ZIP ("Could not add META-INF to ZIP"). The fat
// jar is the intended artifact, so disable the thin plain jar.
jar.enabled = false

// Process resources to replace version placeholder
processResources {
    filesMatching('META-INF/sponge_plugins.json') {
        expand(
            'version': project.version
        )
    }
}

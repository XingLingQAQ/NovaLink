[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Endstone enforces the distribution name in TWO steps, not one prefix test
# (endstone/plugin/plugin_loader.py::_load_plugin_from_ep, read out of the
# installed 0.11.8 source rather than retyped):
#   1. ep.dist.name.replace("_", "-").startswith("endstone-")
#   2. ep.dist.name.replace("_", "-") == "endstone-" + ep.name.replace("_", "-")
# With the entry-point key `novachat` (see [project.entry-points."endstone"]
# below), step 2 therefore requires the distribution to be EXACTLY
# "endstone-novachat". The previous name "novachat-endstone" did not satisfy
# even step 1 -- it merely LOOKED like it satisfied a prefix until you read
# which prefix -- and endstone refused the plugin outright:
#   Error occurred when trying to load plugin from entry point 'novachat':
#   Invalid name.
#   The name of distribution (novachat-endstone) does not start with
#   'endstone-' or 'endstone_'.
# Reproduced against the real loader by calling _load_plugin_from_ep with the
# installed entry point: "novachat-endstone" -> REJECTED, "endstone-novachat"
# -> clears the name gate. endstone 0.11.8 and 0.11.9 behave identically.
# Only the distribution name is constrained. The python package directory stays
# `novachat_endstone`, and plugin.toml's main stays
# "novachat_endstone.plugin:NovaChatPlugin".
name = "endstone-novachat"
version = "1.0.0"
description = "NovaChat plugin for Endstone - Cross-server chat integration for Minecraft Bedrock Edition"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "NovaChat Team" }
]
keywords = ["minecraft", "bedrock", "endstone", "chat", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

# Endstone 0.11.x is the current stable API line (endstone 0.11.8, 2026-08-07).
# It supports BDS 1.26.40 and Python 3.10 through 3.14 (verified via PyPI).
# Pin >=0.11,<0.12 to stay on the stable API line the plugin is written against.
dependencies = [
    "endstone>=0.11,<0.12",
    "ruamel.yaml>=0.18.6,<0.19",
]

# Entry point so Endstone's pip-based plugin loader discovers NovaChatPlugin.
# The key MUST be the project name without the "endstone-" prefix
# ("novachat"), per the Endstone tutorial; the value is {module}:{class}.
[project.entry-points."endstone"]
novachat = "novachat_endstone.plugin:NovaChatPlugin"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["novachat_endstone"]
artifacts = ["novachat_endstone/config/default_config.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.hypothesis]
max_examples = 100

name: NovaChat
version: ${version}
main: com.nova.chat.nukkit.NovaChatNukkit
api: ["1.0.0"]
description: Cross-server chat channel system for Nukkit Bedrock
author: Nova Team
website: https://github.com/nova/novachat

# ==========================================
# Version Compatibility
# ==========================================
# Supported Nukkit API: 1.0.0+
# Supported Minecraft Bedrock: 1.20+ through 26.30
# NovaProtocol version: 1
# Minimum Java version: 8
# ==========================================

commands:
  novachat:
    description: NovaChat main command
    usage: /<command> [subcommand] [args]
    aliases: [nc]

permissions:
  novachat.use:
    description: Allows basic NovaChat usage (main command gate)
    default: true
  novachat.admin:
    description: Client administrator permission
    default: op
    children:
      novachat.mute: true
      novachat.kick: true
      novachat.ban: true
      novachat.announce: true
      novachat.title: true
      novachat.reload: true
      novachat.debug: true
  novachat.mute:
    description: Mute players in channels
    default: op
  novachat.kick:
    description: Kick players from channels
    default: op
  novachat.ban:
    description: Ban and unban players from channels or network-wide
    default: op
  novachat.announce:
    description: Send announcements to channels
    default: op
  novachat.title:
    description: Send title messages to channels
    default: op
  novachat.auth:
    description: Super admin authentication (hidden command)
    default: false
  novachat.reload:
    description: Reload plugin configuration
    default: op
  novachat.debug:
    description: Toggle debug mode
    default: op
  novachat.bypass.world:
    description: Bypass world restrictions for channels
    default: op
  novachat.channel.*:
    description: Access to all channels
    default: false
  novachat.channel.global:
    description: Access to global channel
    default: true
  novachat.create:
    description: Create private channels
    default: true
  novachat.invite:
    description: Invite players to channels
    default: true

# ==========================================
# NovaChat PocketMine-MP 插件配置文件
# NovaChat PocketMine-MP Plugin Configuration
# ==========================================

config-version: 1

# 后端连接设置 / Backend Connection Settings
backend:
  host: "127.0.0.1"
  port: 8888
  username: "PMMP_Server"
  password: "your-password-here"
  server-version: "5.0.0"  # 服务器版本（协议v3握手上报）/ Server version (reported in protocol v3 handshake)
  reconnect-delay: 5  # 重连延迟（秒）/ Reconnect delay (seconds)
  # TLS (AUTH-002): 加密后端传输层。默认关闭以保持明文兼容（后端 InsecureModeGate 在
  # 生产环境强制开启 TLS）。启用时始终验证后端证书——不提供关闭验证的后门。
  # TLS (AUTH-002): encrypt the backend transport. Default off keeps the
  # plaintext path (the backend's insecure-mode gate controls forced TLS in
  # production). When enabled the backend certificate is ALWAYS verified —
  # there is no option to disable verification.
  tls:
    enable: false
    # 验证后端证书的 CA 证书 (PEM)。空=用系统 CA 存储；非空=仅用此 CA 验证。
    # CA certificate (PEM) to verify the backend. Empty = system CA store.
    ca_cert_path: ""
    # 可选 mTLS 客户端证书/私钥（后端默认不要求 mTLS，此为预留）。
    # Optional mTLS client cert/key (backend does not require mTLS by default).
    client_cert_path: ""
    client_key_path: ""

# 聊天设置 / Chat Settings
chat:
  replace_vanilla: false  # 是否替换原版聊天 / Replace vanilla chat
  default_channel: "local"  # 默认频道 / Default channel

# ==========================================
# 消息格式 / Message Format
# ==========================================
# 可用变量 / Available variables:
#   {player} - 玩家名称 / Player name
#   {display_name} - 玩家显示名称 / Player display name
#   {channel} - 频道ID / Channel ID
#   {channel_name} - 频道显示名称 / Channel display name
#   {message} - 消息内容 / Message content
#   {world} - 玩家所在世界 / Player's world
#   {server} - 服务器名称 / Server name
#
# 注意: Bedrock版不支持Hex颜色，将自动转换为最接近的标准颜色
# Note: Bedrock Edition doesn't support Hex colors, they will be
#       converted to the nearest standard color automatically
# ==========================================
format:
  # 系统消息格式 / System message format
  prefix: "§8[§bNovaChat§8]§r "
  error: "§c错误: {message}"
  success: "§a成功: {message}"
  
  # 频道消息格式 (按频道ID配置) / Channel message format (by channel ID)
  channels:
    # 全局频道格式 / Global channel format
    global: "§c[全服] §7{player}§f: {message}"
    
    # 本地频道格式 / Local channel format
    local: "§e[本地] §7{player}§f: {message}"
    
    # 资源区频道格式 / Resource channel format
    resource: "§a[资源] §7{player}§f: {message}"
    
    # PVP 频道格式 / PVP channel format
    pvp: "§c[PVP] §7{player}§f: {message}"
    
    # 私有频道默认格式 / Private channel default format
    private_default: "§d[私聊] §7{player}§f: {message}"
  
  # 默认格式 (未配置的频道使用此格式) / Default format (for unconfigured channels)
  default: "§7[{channel_name}] {player}§f: {message}"

# 调试模式 / Debug Mode
debug: false

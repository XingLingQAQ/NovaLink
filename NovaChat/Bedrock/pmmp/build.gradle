// NovaChat-PMMP Gradle wrapper.
//
// PocketMine-MP plugins are PHP packages built/tested with Composer + PHPUnit.
// This project does NOT apply the java plugin; it uses the base plugin
// (lifecycle clean/build) and delegates the real work to the PHP toolchain
// via Exec tasks:
//   - testEnv   : ensures PHPUnit phar + Eris library are available
//   - phpunit   : runs the PHPUnit test suite (via phar + custom bootstrap)
//   - build     : depends on testEnv + phpunit
//   - clean     : remove vendor/ + build/ + .phpunit.cache/
//
// The standard `composer install` approach downloads the full pocketmine-mp
// runtime (~100MB) which is slow on restricted networks. Instead, tests use
// a standalone PHPUnit phar + git-cloned Eris library + a custom PSR-4
// bootstrap (tests/bootstrap.php) that loads only the NovaChat classes and
// Eris — sufficient for the protocol/i18n unit tests that don't depend on
// pocketmine runtime classes.
//
// Run independently with:  gradle :NovaChat:Bedrock:pmmp:build
// or directly from this dir: gradle -p NovaChat/Bedrock/pmmp build
//
// Toolchain guard: PHP (and the PowerShell used by testEnv to download the
// phpunit phar) are NOT installed on the ubuntu java-ci runner. The dedicated
// bedrock-ci workflow sets up PHP via shivammathur/setup-php and runs the
// real test there (`composer test`, which uses composer-installed phpunit --
// a different, non-phar path). So every PHP/powershell task self-skips
// (with a clear log line) when its toolchain is not on PATH, keeping
// `gradle build` green on toolchain-less hosts while running the real build
// where the toolchain is present.

plugins {
    id 'base'
}

// True when the given executable is resolvable on PATH (config-time check).
def onPath = { String exe ->
    try {
        def proc = [exe, '--version'].execute((List) null, projectDir)
        proc.waitFor()
        return proc.exitValue() == 0
    } catch (Exception ignored) {
        return false
    }
}

def phpAvailable = onPath('php')
def powershellAvailable = onPath('powershell')

def skipReason = '[pmmp] PHP toolchain not found on PATH -- skipping native build. ' +
    'Run via the bedrock-ci workflow (ubuntu + shivammathur/setup-php) or install PHP locally.'

tasks.register('testEnv') {
    group = 'build'
    description = 'Ensures PHPUnit phar and Eris library are available for testing.'
    def phpunitPhar = layout.projectDirectory.file('vendor/bin/phpunit.phar').asFile
    def erisDir = layout.projectDirectory.dir('vendor/giorgiosironi/eris').asFile
    outputs.file phpunitPhar
    outputs.dir erisDir
    // Self-skip when the toolchains testEnv relies on are absent. testEnv
    // downloads the phpunit phar via powershell (Windows-only here) -- on a
    // non-Windows toolchain-less host there is nothing it can do.
    onlyIf { powershellAvailable }
    doFirst {
        if (!powershellAvailable) logger.lifecycle(skipReason)
    }
    doLast {
        def vendorBin = layout.projectDirectory.dir('vendor/bin').asFile
        if (!vendorBin.exists()) vendorBin.mkdirs()
        // Download PHPUnit phar if missing.
        if (!phpunitPhar.exists()) {
            exec {
                commandLine 'powershell', '-Command',
                    "Invoke-WebRequest -Uri 'https://phar.phpunit.de/phpunit-10.5.phar' -OutFile '${phpunitPhar.absolutePath}' -TimeoutSec 120"
                workingDir projectDir
            }
        }
        // Clone Eris if missing.
        if (!erisDir.exists() || !erisDir.listFiles()) {
            def parent = erisDir.parentFile
            if (!parent.exists()) parent.mkdirs()
            exec {
                commandLine 'git', 'clone', '--depth', '1',
                    'https://github.com/giorgiosironi/eris.git',
                    erisDir.absolutePath
                workingDir projectDir
            }
        }
    }
}

tasks.register('phpunit', Exec) {
    group = 'verification'
    description = 'Runs the PHPUnit test suite via phar.'
    dependsOn tasks.named('testEnv')
    def phpunitPhar = layout.projectDirectory.file('vendor/bin/phpunit.phar').asFile
    commandLine 'php', phpunitPhar.absolutePath, '--configuration', 'phpunit.xml'
    workingDir projectDir
    inputs.dir layout.projectDirectory.dir('tests')
    inputs.dir layout.projectDirectory.dir('src')
    inputs.file layout.projectDirectory.file('phpunit.xml').asFile
    onlyIf { phpAvailable }
    doFirst {
        if (!phpAvailable) logger.lifecycle(skipReason)
    }
}

tasks.named('build') {
    group = 'build'
    description = 'Builds the PMMP plugin (test env + phpunit).'
    dependsOn tasks.named('testEnv'), tasks.named('phpunit')
    doFirst {
        if (!phpAvailable) logger.lifecycle(skipReason)
    }
}

tasks.named('clean') {
    doLast {
        delete layout.projectDirectory.dir('vendor').asFile
        delete layout.projectDirectory.dir('build').asFile
        delete layout.projectDirectory.dir('.phpunit.cache').asFile
        delete layout.projectDirectory.file('.phpunit.result.cache').asFile
    }
}

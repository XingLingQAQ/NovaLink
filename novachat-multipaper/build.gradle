plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    // MultiPaper repo - may have connectivity issues
    maven { 
        url 'https://repo.multipaper.io/releases/' 
        content {
            includeGroup 'puregero.multipaper'
        }
    }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    // Common Module
    implementation project(':novachat-common')

    // Netty
    implementation "io.netty:netty-all:${nettyVersion}"

    // Utilities
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    // Minecraft Platform - Paper API (MultiPaper is Paper-based)
    compileOnly "io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT"
    
    // MultiPaper API - optional, detected at runtime
    // compileOnly "puregero.multipaper:multipaper-api:1.20.4-R0.1-SNAPSHOT"
    
    // PlaceholderAPI
    compileOnly "me.clip:placeholderapi:2.11.5"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "net.jqwik:jqwik:${jqwikVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
}

tasks.named('test') {
    useJUnitPlatform {
        includeEngines 'junit-jupiter', 'jqwik'
    }
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Shadow JAR configuration for fat jar packaging
shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('NovaChat-MultiPaper')
    
    // Relocate dependencies to avoid conflicts
    relocate 'io.netty', 'com.nova.chat.multipaper.libs.netty'
    relocate 'com.google.gson', 'com.nova.chat.multipaper.libs.gson'
    
    // Exclude unnecessary files
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    
    dependencies {
        // Include novachat-common
        include(project(':novachat-common'))
        // Include runtime dependencies
        include(dependency('io.netty:.*'))
        include(dependency('com.google.code.gson:gson'))
    }
}

// Make build depend on shadowJar
build.dependsOn shadowJar

// Process resources to replace version placeholder
processResources {
    filesMatching('plugin.yml') {
        expand(
            'version': project.version
        )
    }
}

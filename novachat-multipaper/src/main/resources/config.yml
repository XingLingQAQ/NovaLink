# ==========================================
# NovaChat-MultiPaper 插件配置文件
# ==========================================

# 后端连接设置
backend:
  host: "127.0.0.1"
  port: 8888
  username: "MultiPaper_Server"
  password: "your-password-here"
  reconnect-delay: 5  # 重连延迟（秒）

# MultiPaper 特定设置
multipaper:
  # 是否启用跨实例状态同步
  sync-enabled: true
  # 实例 ID（留空则自动检测）
  instance-id: ""

# 聊天设置
chat:
  replace_vanilla: false  # 是否替换原版聊天
  default_channel: "local"  # 默认频道

# ==========================================
# 消息格式 (在插件端配置，服主可自定义)
# ==========================================
# 可用变量:
#   {player} - 玩家名称
#   {display_name} - 玩家显示名称
#   {channel} - 频道ID
#   {channel_name} - 频道显示名称
#   {message} - 消息内容
#   {world} - 玩家所在世界
#   {server} - 服务器名称
#   {instance} - MultiPaper 实例 ID
#   %placeholder% - PlaceholderAPI 变量
# ==========================================
format:
  # 系统消息格式
  prefix: "&8[&bNovaChat&8]&r "
  error: "&c错误: {message}"
  success: "&a成功: {message}"
  
  # 频道消息格式 (按频道ID配置)
  channels:
    # 全局频道格式
    global: "&c[全服] &7{player}&f: {message}"
    
    # 本地频道格式
    local: "&e[本地] &7{player}&f: {message}"
    
    # 资源区频道格式
    resource: "&a[资源] &7{player}&f: {message}"
    
    # PVP 频道格式
    pvp: "&c[PVP] &7{player}&f: {message}"
    
    # 私有频道默认格式
    private_default: "&d[私聊] &7{player}&f: {message}"
  
  # 默认格式 (未配置的频道使用此格式)
  default: "&7[{channel_color}{channel_name}] {player}&f: {message}"

# 调试模式
debug: false

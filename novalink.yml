# ============================================================================
# NovaLink 后端配置文件（本地运行演示）
# ============================================================================
# 这是后端启动时实际读取的运行配置。完整字段说明与示例见 examples/novalink.yml。
# 缺失字段会由 ConfigLoader 自动补全为默认值（见 NovaLinkConfig.createDefault()）。

# ----------------------------------------------------------------------------
# 服务器设置 / Server
# ----------------------------------------------------------------------------
server:
  # TCP 连接绑定地址（0.0.0.0 = 监听所有网卡）
  bind-address: 0.0.0.0
  # NovaProtocol TCP 连接端口（游戏服/客户端连接用）
  port: 8888
  # WebSocket 连接端口（Web 面板连接用）
  websocket-port: 8889
  # JWT 令牌生成密钥（生产环境务必改为 ≥32 字符的随机长字符串）
  # 若保持默认值，后端会自动生成随机密钥并持久化到 data/.jwt-secret（并打 WARN）
  secret-key: change-me-in-production
  # 处理连接的工作线程数
  worker-threads: 4
  # 后端控制台 / 面板消息语言（zh_CN / en_US）
  locale: zh_CN
  # CORS 允许的来源白名单（Web 面板地址）。
  # 默认 ["*"] 允许所有来源（兼容旧行为，启动时会 WARN 提示收紧）；
  # 生产环境请改为面板的确切来源，例如:
  # cors-allowed-origins:
  #   - "https://panel.example.com"
  cors-allowed-origins:
    - "*"
  # TCP 读空闲超时（秒），超时未收到任何数据则判定死连接并断开（0 = 关闭检测）。
  # 心跳方向说明：Bedrock 系客户端每 15 秒主动发 KeepAlive；Java 系客户端只回显
  # 不主动发，因此后端会在写空闲（本值的 1/3，默认 30 秒）时主动发 KeepAlive ping，
  # 客户端回显即可刷新读空闲计时。默认 90 秒 ≥ 3 倍客户端心跳周期（15s），不会误伤。
  idle-timeout-seconds: 90
  # REST 业务专用工作线程池大小（固定）。REST 请求的鉴权/数据库查询/响应写出
  # 都在该池中执行，避免阻塞 Netty IO 线程；池满时直接返回 503。
  rest-worker-threads: 4
  # 每连接消息限流（令牌桶，ChatMessage 与 ItemDisplay 共享同一桶）
  rate-limit:
    # 每秒补充令牌数（持续速率）；0 = 关闭限流
    messages-per-second: 10
    # 桶容量（允许的瞬时突发条数）
    burst: 20

# ----------------------------------------------------------------------------
# 数据库设置 / Database
# ----------------------------------------------------------------------------
# type 选择当前启用的存储后端，其余类型的配置段保留作备用。
#   memory     - 内存存储（重启后数据丢失，仅用于演示/测试）
#   mysql      - MySQL / MariaDB 10.3+ 持久化
#   postgresql - PostgreSQL 持久化
#   sqlite     - 嵌入式文件数据库（单节点/小型部署无需额外服务）
#   redis      - Redis 缓存（需配合上面三者之一做持久化）
database:
  type: memory

  # MySQL / MariaDB 配置（type: mysql 时启用）
  mysql:
    host: 127.0.0.1
    port: 3306
    database: novalink
    username: root
    password: ''
    # 连接池大小
    pool-size: 10

  # PostgreSQL 配置（type: postgresql 时启用）
  postgresql:
    host: 127.0.0.1
    port: 5432
    database: novalink
    username: postgres
    password: ''
    # 连接池大小
    pool-size: 10

  # SQLite 配置（type: sqlite 时启用）
  sqlite:
    # 数据库文件路径（相对后端工作目录）
    file-path: data/novalink.db
    # 连接池大小（SQLite 单写，建议保持小值）
    pool-size: 5

  # Redis 配置（可选缓存，type: redis 时启用）
  redis:
    enabled: false
    host: 127.0.0.1
    port: 6379
    password: ''

# ----------------------------------------------------------------------------
# 安全设置 / Security
# ----------------------------------------------------------------------------
security:
  # 允许连接的 IP 地址/范围（CIDR）；空列表表示不限制
  allowed-ips:
    - 127.0.0.1
  # 连续认证失败后封禁 IP 的时长（秒）
  ip-ban-duration: 300

# ----------------------------------------------------------------------------
# 超级管理员 / Super Admins
# ----------------------------------------------------------------------------
# 超级管理员拥有跨所有客户端的完整系统访问权限，
# 登录 Web 面板时角色为 SUPER_ADMIN（全部权限）。
# 支持两种凭据写法（二选一）：
#   password       - 明文密码，后端启动时自动做 SHA-256，无需预计算
#   password-hash  - 预计算的 SHA-256 十六进制哈希（更安全，不留明文）
# 演示默认账号: admin / admin123（生产环境请务必修改）
super-admins:
  - uuid: "00000000-0000-0000-0000-000000000001"
    username: admin
    password: admin123

# ----------------------------------------------------------------------------
# 面板用户 / Panel Users
# ----------------------------------------------------------------------------
# Web 面板登录账号（与游戏服 clients 凭据完全隔离——游戏服接入密码不能登录面板）。
# 角色（RBAC，VIEWER < ADMIN < SUPER_ADMIN）：
#   VIEWER - 只读：所有 GET 查询端点 + WebSocket 实时数据
#   ADMIN  - VIEWER 全部 + 玩家处罚（禁言/踢出/封禁）+ 频道管理 + 发消息 + 通知管理
# SUPER_ADMIN 只能通过上方 super-admins 配置。
# 凭据写法与 super-admins 相同（password 明文 或 password-hash 预计算哈希，二选一）。
# 本节可省略：省略时仅 super-admins 可登录面板。
panel-users:
  - username: moderator
    password: moderator123
    role: ADMIN
  - username: viewer
    password: viewer123
    role: VIEWER

# ----------------------------------------------------------------------------
# 调试模式 / Debug
# ----------------------------------------------------------------------------
# 启用后输出详细日志，便于排查问题
debug: true

# ----------------------------------------------------------------------------
# 全局频道 / Global Channels（GLOBAL 作用域）
# ----------------------------------------------------------------------------
# 这些频道在所有已连接客户端中可用。消息格式在插件端 config.yml 配置。
global_channels:
  global:
    display_name: 全服
    # 加入所需权限节点
    permission: novachat.channel.global
    # 最大成员数（0 = 无限制）
    max_capacity: 1000
    # 慢速模式：同一玩家两条消息的最小间隔秒数（0 = 关闭；频道管理员及以上豁免）
    # slow_mode: 5

# ----------------------------------------------------------------------------
# 频道模板 / Channel Templates
# ----------------------------------------------------------------------------
# 可复用的频道配置模板，客户端 channels 可通过 use_template 引用。
templates:
  standard_local:
    display_name: 本地
    # 作用域：SERVER / PRIVATE
    scope: SERVER
    max_capacity: 100

# ----------------------------------------------------------------------------
# 客户端配置 / Clients
# ----------------------------------------------------------------------------
# 每个客户端代表一个连接到 NovaLink 的游戏服务器。
# permissions 为空/省略时，向后兼容地授予所有 GLOBAL 频道（等价 "*"）。
clients:
  - username: panel-client
    password: panel-secret
    display-name: NovaPanel
    permissions: []

# ----------------------------------------------------------------------------
# 功能开关 / Features（Web 面板设置页）
# ----------------------------------------------------------------------------
# 这些开关在 Web 面板设置页暴露，热应用到运行时无需完整重启。
features:
  # 启用敏感词过滤
  filter-enabled: true
  # 记录聊天消息到日志并持久化到数据库（供面板消息历史查询）
  message-log-enabled: false
  # 启用跨服聊天分发
  cross-server-chat-enabled: true
  # 启用跨服私聊（/msg /reply；关闭后发送方收到 NC-403 提示）
  private-messages-enabled: true
  # 持久化消息保留天数（0 = 永久保留；每小时自动清理过期消息）
  message-log-retention-days: 30

# ----------------------------------------------------------------------------
# 敏感词过滤 / Filter（自定义词与正则，面板可管理）
# ----------------------------------------------------------------------------
# 自定义敏感词与正则模式（在内置词表基础上追加）。
# 开关本身由 features.filter-enabled 控制；本节内容可通过面板
# GET/PUT /api/filter 查看与全量替换，保存后自动落盘到本文件。
filter:
  # 自定义敏感词列表（命中后替换为 ***）
  words: []
  # 自定义正则模式列表（不区分大小写；非法正则会被跳过并告警）
  patterns: []

# ============================================================================
# NovaLink 后端配置文件（本地运行演示）
# ============================================================================
# 这是后端启动时实际读取的运行配置。完整字段说明与示例见 examples/novalink.yml。
# 缺失字段会由 ConfigLoader 自动补全为默认值（见 NovaLinkConfig.createDefault()）。

# ----------------------------------------------------------------------------
# 服务器设置 / Server
# ----------------------------------------------------------------------------
server:
  # TCP 连接绑定地址（0.0.0.0 = 监听所有网卡）
  bind-address: 0.0.0.0
  # NovaProtocol TCP 连接端口（游戏服/客户端连接用）
  port: 8888
  # WebSocket 连接端口（Web 面板连接用）
  websocket-port: 8889
  # JWT 令牌生成密钥（生产环境务必改为随机长字符串）
  secret-key: change-me-in-production
  # 处理连接的工作线程数
  worker-threads: 4
  # 后端控制台 / 面板消息语言（zh_CN / en_US）
  locale: zh_CN

# ----------------------------------------------------------------------------
# 数据库设置 / Database
# ----------------------------------------------------------------------------
# type 选择当前启用的存储后端，其余类型的配置段保留作备用。
#   memory     - 内存存储（重启后数据丢失，仅用于演示/测试）
#   mysql      - MySQL / MariaDB 10.3+ 持久化
#   postgresql - PostgreSQL 持久化
#   sqlite     - 嵌入式文件数据库（单节点/小型部署无需额外服务）
#   redis      - Redis 缓存（需配合上面三者之一做持久化）
database:
  type: memory

  # MySQL / MariaDB 配置（type: mysql 时启用）
  mysql:
    host: 127.0.0.1
    port: 3306
    database: novalink
    username: root
    password: ''
    # 连接池大小
    pool-size: 10

  # PostgreSQL 配置（type: postgresql 时启用）
  postgresql:
    host: 127.0.0.1
    port: 5432
    database: novalink
    username: postgres
    password: ''
    # 连接池大小
    pool-size: 10

  # SQLite 配置（type: sqlite 时启用）
  sqlite:
    # 数据库文件路径（相对后端工作目录）
    file-path: data/novalink.db
    # 连接池大小（SQLite 单写，建议保持小值）
    pool-size: 5

  # Redis 配置（可选缓存，type: redis 时启用）
  redis:
    enabled: false
    host: 127.0.0.1
    port: 6379
    password: ''

# ----------------------------------------------------------------------------
# 安全设置 / Security
# ----------------------------------------------------------------------------
security:
  # 允许连接的 IP 地址/范围（CIDR）；空列表表示不限制
  allowed-ips:
    - 127.0.0.1
  # 连续认证失败后封禁 IP 的时长（秒）
  ip-ban-duration: 300

# ----------------------------------------------------------------------------
# 超级管理员 / Super Admins
# ----------------------------------------------------------------------------
# 超级管理员拥有跨所有客户端的完整系统访问权限。
# 支持两种凭据写法（二选一）：
#   password       - 明文密码，后端启动时自动做 SHA-256，无需预计算
#   password-hash  - 预计算的 SHA-256 十六进制哈希（更安全，不留明文）
# 演示默认账号: admin / admin123（生产环境请务必修改）
super-admins:
  - uuid: "00000000-0000-0000-0000-000000000001"
    username: admin
    password: admin123

# ----------------------------------------------------------------------------
# 调试模式 / Debug
# ----------------------------------------------------------------------------
# 启用后输出详细日志，便于排查问题
debug: true

# ----------------------------------------------------------------------------
# 全局频道 / Global Channels（GLOBAL 作用域）
# ----------------------------------------------------------------------------
# 这些频道在所有已连接客户端中可用。消息格式在插件端 config.yml 配置。
global_channels:
  global:
    display_name: 全服
    # 加入所需权限节点
    permission: novachat.channel.global
    # 最大成员数（0 = 无限制）
    max_capacity: 1000

# ----------------------------------------------------------------------------
# 频道模板 / Channel Templates
# ----------------------------------------------------------------------------
# 可复用的频道配置模板，客户端 channels 可通过 use_template 引用。
templates:
  standard_local:
    display_name: 本地
    # 作用域：SERVER / PRIVATE
    scope: SERVER
    max_capacity: 100

# ----------------------------------------------------------------------------
# 客户端配置 / Clients
# ----------------------------------------------------------------------------
# 每个客户端代表一个连接到 NovaLink 的游戏服务器。
# permissions 为空/省略时，向后兼容地授予所有 GLOBAL 频道（等价 "*"）。
clients:
  - username: panel-client
    password: panel-secret
    display-name: NovaPanel
    permissions: []

# ----------------------------------------------------------------------------
# 功能开关 / Features（Web 面板设置页）
# ----------------------------------------------------------------------------
# 这些开关在 Web 面板设置页暴露，热应用到运行时无需完整重启。
features:
  # 启用敏感词过滤
  filter-enabled: true
  # 记录聊天消息到日志
  message-log-enabled: false
  # 启用跨服聊天分发
  cross-server-chat-enabled: true

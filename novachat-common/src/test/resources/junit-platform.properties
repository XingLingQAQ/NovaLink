# JUnit Platform Configuration
# See: https://junit.org/junit5/docs/current/user-guide/#running-tests-config-params

# jqwik Property-Based Testing Configuration
# See: https://jqwik.net/docs/current/user-guide.html#jqwik-configuration

# Default number of tries for property tests
jqwik.tries.default=100

# Database for storing test results
jqwik.database=.jqwik-database

# Reporting configuration
jqwik.reporting.onlyFailures=false
jqwik.reporting.usejunitplatform=true

# Edge cases configuration
jqwik.edgeCases.mode=MIXIN
jqwik.edgeCases.total=10

# Shrinking configuration
jqwik.shrinking.mode=FULL
jqwik.shrinking.bounded=true

# JUnit Jupiter configuration
junit.jupiter.execution.parallel.enabled=false
junit.jupiter.testinstance.lifecycle.default=per_method

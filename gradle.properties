# Toolchain auto-detection: scoop installs JDKs under %USERPROFILE%\scoop\apps,
# which Gradle does not scan by default. Point it at the Temurin installations
# so `java { toolchain { languageVersion = of(25) } }` (used by novachat-velocity,
# whose Velocity API requires JDK 25) can locate JDK 25 without per-build flags.
org.gradle.java.installations.paths=C:\\Users\\XingLingQAQ\\scoop\\apps\\temurin25-jdk\\current,C:\\Users\\XingLingQAQ\\scoop\\apps\\temurin21-jdk\\current

